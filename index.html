 id=\"bImp\">重要語のみ<\/button><span class=\"k hk\">H<\/span><\/span>\n  <button id=\"bPeek\" class=\"view-only\">全表示<span class=\"k\">S<\/span><\/button>\n  <span class=\"grp edit-only\"><button id=\"b1\" class=\"t1\">通常<\/button><button id=\"b2\" class=\"t2\">重要<\/button><button id=\"b0\">解除<\/button><\/span>\n  <span class=\"grp edit-only\"><span class=\"gl\">行の種類<\/span><span class=\"menuwrap\"><button id=\"hsel\" class=\"ddb\"><span id=\"hlabel\">本文<\/span><i class=\"cv\"><\/i><\/button><div id=\"hmenu\" hidden><button data-v=\"0\" class=\"cur\"><span>本文<\/span><span class=\"sc\">Ctrl+Alt+0<\/span><\/button><button data-v=\"1\"><span>見出し1<\/span><span class=\"sc\">Ctrl+Alt+1<\/span><\/button><button data-v=\"2\"><span>見出し2<\/span><span class=\"sc\">Ctrl+Alt+2<\/span><\/button><button data-v=\"3\"><span>見出し3<\/span><span class=\"sc\">Ctrl+Alt+3<\/span><\/button><button data-v=\"4\"><span>見出し4<\/span><span class=\"sc\">Ctrl+Alt+4<\/span><\/button><button data-v=\"5\"><span>見出し5<\/span><span class=\"sc\">Ctrl+Alt+5<\/span><\/button><button data-v=\"6\"><span>見出し6<\/span><span class=\"sc\">Ctrl+Alt+6<\/span><\/button><\/div><\/span><\/span>\n  <span class=\"grp\"><button id=\"mV\" class=\"on\">閲覧<span class=\"k\">Esc<\/span><\/button><button id=\"mE\">編集<span class=\"k\">E<\/span><\/button><\/span>\n  <span class=\"menuwrap\"><button id=\"bFile\" class=\"solid\">メニュー<\/button>\n    <div id=\"fmenu\" hidden>\n      <button id=\"bOpen\"><span>開く<\/span><span class=\"sc\">Ctrl+O<\/span><\/button>\n      <button id=\"bSave\"><span>保存<\/span><span class=\"sc\">Ctrl+S<\/span><\/button>\n      <button id=\"bCopy\"><span>コピー<\/span><\/button>\n      <hr>\n      <button id=\"bHelp\"><span>ショートカット<\/span><span class=\"sc\">Ctrl+/<\/span><\/button>\n      <button id=\"bGuide\"><span>ヘルプ<\/span><\/button>\n      <hr>\n      <div class=\"vrow\"><span>表示<\/span><span class=\"grp vseg\"><button data-view=\"auto\">自動<\/button><button data-view=\"pc\">PC<\/button><button data-view=\"mobile\">スマホ<\/button><\/span><\/div>\n      \n    <\/div>\n  <\/span>\n<\/div>\n<div id=\"wrap\"><nav id=\"toc\" hidden><\/nav><div id=\"sheet\" tabindex=\"-1\"><div id=\"empty\">.txt をここにドロップ、または Ctrl+O<\/div><\/div><div id=\"ed\" contenteditable=\"true\" spellcheck=\"false\"><\/div><\/div>\n<div id=\"foot\">見出しは <b>== 見出し ==<\/b>、語は <b>**通常**<\/b> <b>***重要***<\/b> の形で保存されます（編集は見た目のまま行えます）<\/div>\n<div id=\"help\" hidden><div class=\"card\">\n  <h3>ショートカット<\/h3>\n  <div class=\"cols\">\n    <div>\n      <h4>共通<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>O<\/kbd>ファイルを開く<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>S<\/kbd>保存<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>/<\/kbd>この一覧<\/p>\n      <p><kbd>E<\/kbd>編集モードへ（閲覧中）<\/p>\n      <p><kbd>Esc<\/kbd>閲覧モードへ（編集中）<\/p>\n      <h4>閲覧<\/h4>\n      <p><kbd>Space<\/kbd>次の語を表示<\/p>\n      <p><kbd>Shift<\/kbd><kbd>Space<\/kbd>1つ戻す<\/p>\n      <p><kbd>H<\/kbd>段階を切替<\/p>\n      <p><kbd>S<\/kbd>全表示<\/p>\n      <p><kbd>R<\/kbd>隠し直し<\/p>\n      <p><kbd>クリック<\/kbd>その語だけ表示<\/p>\n    <\/div>\n    <div>\n      <h4>編集：印<\/h4>\n      <p><kbd>Alt<\/kbd><kbd>1<\/kbd>通常<\/p>\n      <p><kbd>Alt<\/kbd><kbd>2<\/kbd>重要<\/p>\n      <p><kbd>Alt<\/kbd><kbd>3<\/kbd>解除<\/p>\n      <p><kbd>ドラッグ<\/kbd>ツール選択中は自動適用<\/p>\n      <h4>編集：行の種類<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>Alt<\/kbd><kbd>0<\/kbd>本文<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Alt<\/kbd><kbd>1〜6<\/kbd>見出し1〜6<\/p>\n      <h4>編集：操作<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>Z<\/kbd>取り消し<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Y<\/kbd>やり直し<\/p>\n    <\/div>\n  <\/div>\n<\/div><\/div>\n<div id=\"guide\" hidden><div class=\"card\">\n  <div class=\"gh\"><h3>Anki Sheet の使い方 <small class=\"gv\">v2.2<\/small><\/h3><button id=\"gClose\">閉じる<\/button><\/div>\n  <p class=\"lead\">テキストファイル（.txt）から、赤シート式の暗記シートを作るツールです。覚えたい語に印を付けて隠し、思い出す練習ができます。ブラウザだけで動き、内容は外部に送信されません。前回開いたファイルは、次回起動時に自動で開きます。<\/p>\n\n  <h4><i>1<\/i>ファイルを開く<\/h4>\n  <p>「メニュー → 開く」（<kbd>Ctrl+O<\/kbd>）を使うか、.txt をウィンドウにドラッグ＆ドロップします。<\/p>\n\n  <h4><i>2<\/i>編集する（編集モード）<\/h4>\n  <p>上部の「編集」に切り替える（<kbd>E<\/kbd>）と、見た目のまま文章を書き換えられます。印を付けた語は、通常が <span class=\"o\">オレンジ<\/span>、重要が <span class=\"r\">赤・太字<\/span> で表示され、見出しは大きな文字で表示されます。<\/p>\n  <ul>\n    <li>語を選び、「通常」「重要」「解除」のボタン（<kbd>Alt+1<\/kbd> / <kbd>Alt+2<\/kbd> / <kbd>Alt+3<\/kbd>）で印を付け外しします<\/li>\n    <li>範囲を選ばずにボタンを押すと、そのツールが選択中になり、ドラッグで範囲を選んだ時点ですぐ適用されます（もう一度ボタンを押すと、選択中のツールが外れます）<\/li>\n    <li>カーソルがある行の種類は、プルダウン（開くとショートカットが見えます）で「本文」「見出し1〜6」に変更できます<\/li>\n    <li>保存すると、見出しは <code>== 見出し ==<\/code> の形に整えられ、節と節の間に空行が1行ずつ入ります<\/li>\n    <li><kbd>Ctrl+Z<\/kbd> で取り消し、<kbd>Esc<\/kbd> で閲覧モードに戻ります<\/li>\n  <\/ul>\n\n  <h4><i>3<\/i>隠して覚える（閲覧モード）<\/h4>\n  <p>「閲覧」に切り替えると、印を付けた語が赤いシートで隠れます。<\/p>\n  <ul>\n    <li>「すべて」は通常語も重要語も隠し、「重要語のみ」は重要語だけを隠します（<kbd>H<\/kbd> で切替）<\/li>\n    <li>語をクリックすると、その語だけ表示されます<\/li>\n    <li><kbd>Space<\/kbd> で次の語を順に表示、<kbd>Shift+Space<\/kbd> で1つ戻します<\/li>\n    <li><kbd>S<\/kbd> で全表示、<kbd>R<\/kbd> で隠し直します<\/li>\n  <\/ul>\n\n  <h4><i>4<\/i>見出しと目次<\/h4>\n  <p>行を <code>== 見出し ==<\/code> のように = で囲むと見出しになり、左側に目次が出ます。= の数が多いほど下の階層です。目次の ▾ で枝を、「目次」の文字で全体を折りたためます。<\/p>\n  <p>見出しは .txt に直接書くか、「編集」モードで作ります。<\/p>\n\n  <h4><i>5<\/i>保存とスマホ版<\/h4>\n  <p>編集内容はブラウザ内に自動で記録され、<kbd>Ctrl+S<\/kbd> で元の .txt に書き込めます。「コピー」で印付きのテキストをコピーして、スマホ版（Anki Sheet Mobile）に貼り付けることもできます。<\/p>\n\n  <h4 class=\"plain\">.txt の書き方<\/h4>\n  <p><code>**通常の語**<\/code>　<code>***重要な語***<\/code>　<code>== 見出し ==<\/code><br>このように直接書いても、そのまま読み込まれます。<\/p>\n  <h4 class=\"plain\">表示モード<\/h4>\n  <p>端末に合わせて、PC向けとスマホ向けの表示が自動で切り替わります。「メニュー → 表示」で、自動・PC・スマホを選べます。<\/p>\n<\/div><\/div>\n<div id=\"conflict\" hidden><div class=\"card\">\n  <h3>ファイルが外部で更新されました<\/h3>\n  <p>元のファイル「<b id=\"cName\"><\/b>」が、このページ以外で変更されました。ページ上には、まだ保存していない編集があります。<\/p>\n  <p>どちらの内容を残しますか？「ファイルの内容に置き換える」を選ぶと、ページ上の編集は失われます。<\/p>\n  <div class=\"cb\"><button id=\"cMine\">ページの編集を残す<\/button><button id=\"cFile\" class=\"solid\">ファイルの内容に置き換える<\/button><\/div>\n<\/div><\/div>\n<div id=\"toast\"><\/div>\n<input type=\"file\" id=\"file\" accept=\".txt,text/plain\" hidden>\n<script>\nconst $=id=>document.getElementById(id), sheet=$('sheet'), body=document.body;\nconst H=[],F=[],revStack=[];let tocInit=false;\nconst S={docId:0,heads:{},mode:'view',tool:null,baseSrc:null,name:'',text:'',marks:[],handle:null,dirty:false,mtime:0,stage:'all'};\n\n/* ---------- IndexedDB ---------- */\nconst idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('anki-sheet',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});\nasync function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}}\nasync function kvSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch{}}\nasync function persistSafe(){const rec={name:S.name,src:serialize(),handle:S.handle,dirty:S.dirty,mtime:S.mtime,stage:S.stage,baseSrc:S.baseSrc};try{await kvSet('last',rec)}catch{}}\n\n/* ---------- parse / serialize ---------- */\nconst HR=/^\\s*(={1,6})\\s*(.+?)\\s*\\1\\s*$/;\nfunction parse(src){\n  src=src.replace(/^\\uFEFF/,'').replace(/\\r\\n?/g,'\\n');\n  const heads={},raw=src.split('\\n'),keep=[];let bh=false;\n  for(let i=raw.length-1;i>=0;i--){const l=raw[i];if(HR.test(l)){bh=true;keep.push(l)}else if(!l.trim()){if(!bh)keep.push(l)}else{bh=false;keep.push(l)}}\n  keep.reverse();\n  src=keep.map((ln,i)=>{const h=ln.match(HR);if(h){heads[i]=h[1].length;return h[2]}return ln}).join('\\n');\n  const re=/\\*\\*\\*([^\\n]+?)\\*\\*\\*|\\*\\*([^\\n]+?)\\*\\*/g;let t='',last=0,m,marks=[];\n  while((m=re.exec(src))){t+=src.slice(last,m.index);const w=m[1]??m[2];marks.push({s:t.length,e:t.length+w.length,l:m[1]!=null?2:1});t+=w;last=re.lastIndex}\n  t+=src.slice(last);return{text:t,marks,heads};\n}\nfunction serialize(){\n  let o='',c=0;for(const m of S.marks){const k=m.l==2?'***':'**';o+=S.text.slice(c,m.s)+k+S.text.slice(m.s,m.e)+k;c=m.e}\n  o+=S.text.slice(c);\n  const hs=S.heads||{};if(!Object.keys(hs).length)return o;\n  const out=[];o.split('\\n').forEach((l,i)=>{if(hs[i]){if(i>0)out.push('');out.push('='.repeat(hs[i])+' '+l.trim()+' '+'='.repeat(hs[i]))}else out.push(l)});\n  return out.join('\\n');\n}\n\n/* ---------- render ---------- */\nconst esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction render(){\n  revStack.length=0;const keep=scrollY,{text,marks}=S;let h='',pos=0,mi=0,li=0;\n  for(const line of text.split('\\n')){\n    const ls=pos,le=pos+line.length;let c=ls;const hl=S.heads[li];h+=`<div class=\"ln${hl?' h h'+Math.min(hl,4):''}\" data-l=\"${ls}\"${hl?` data-i=\"${li}\"`:''}>`;\n    while(mi<marks.length&&marks[mi].s<le){const m=marks[mi++];if(m.s>c)h+=`<span data-o=\"${c}\">${esc(text.slice(c,m.s))}<\/span>`;\n      h+=`<span class=\"m m${m.l}\" data-o=\"${m.s}\">${esc(text.slice(m.s,m.e))}<\/span>`;c=m.e}\n    if(c<le)h+=`<span data-o=\"${c}\">${esc(text.slice(c,le))}<\/span>`;\n    if(!line)h+='<br>';h+='<\/div>';pos=le+1;li++;\n  }\n  sheet.innerHTML=h;scrollTo(0,keep);info();buildToc();\n}\nfunction setTitle(t){try{if(parent!==window&&parent.__shell&&parent.__shell.target!==MODE)return;parent.document.title=t}catch{document.title=t}}\nfunction info(){\n  const n1=S.marks.filter(m=>m.l==1).length,n2=S.marks.length-n1;\n  $('name').textContent=S.name?S.name+(S.dirty?' •':''):'';\n  $('info').textContent=S.name?`通常 ${n1} ／ 重要 ${n2}`:'';\n  setTitle((S.dirty?'● ':'')+(S.name?S.name+' - ':'')+'Anki Sheet');\n}\n\n/* ---------- load / open ---------- */\nasync function decode(file){\n  const buf=await file.arrayBuffer();\n  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('shift_jis').decode(buf)}\n}\nfunction load(src,name,handle,keepState){\n  H.length=0;F.length=0;tocInit=false;\n  const p=parse(src);S.text=p.text;S.marks=p.marks;S.heads=p.heads;S.name=name;S.handle=handle||null;\n  if(!keepState){S.dirty=false;S.docId=Math.random()}\n  render();persistSafe();\n  if(S.mode==='edit')enterText();\n}\nasync function openFile(file,handle){\n  const src=await decode(file);S.mtime=file.lastModified;S.dirty=false;S.baseSrc=src;load(src,file.name,handle);\n}\nasync function pick(){\n  if(window.showOpenFilePicker){\n    try{const [h]=await showOpenFilePicker({types:[{description:'テキスト',accept:{'text/plain':['.txt']}}]});openFile(await h.getFile(),h)}catch(e){if(e.name!=='AbortError')console.error(e)}\n  }else $('file').click();\n}\n$('file').onchange=e=>{const f=e.target.files[0];if(f)openFile(f,null);e.target.value=''};\naddEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag')});\naddEventListener('dragleave',()=>body.classList.remove('drag'));\naddEventListener('drop',async e=>{\n  e.preventDefault();body.classList.remove('drag');const it=e.dataTransfer.items[0];if(!it)return;\n  let h=null;try{h=await it.getAsFileSystemHandle?.()}catch{}\n  if(h&&h.kind==='file')openFile(await h.getFile(),h);else{const f=e.dataTransfer.files[0];if(f)openFile(f,null)}\n});\n\n/* ---------- save ---------- */\nasync function save(){\n  if(S.mode==='edit')commitText();\n  if(!S.text&&!S.name)return;const src=serialize();\n  try{\n    if(S.handle){\n      if(await S.handle.requestPermission({mode:'readwrite'})!=='granted')throw 0;\n      const w=await S.handle.createWritable();await w.write(src);await w.close();\n      S.mtime=(await S.handle.getFile()).lastModified;S.baseSrc=src;S.dirty=false;info();persistSafe();return;\n    }\n  }catch{}\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/plain'}));a.download=S.name||'memo.txt';a.click();\n  S.dirty=false;info();persistSafe();\n}\n\n/* ---------- selection -> marks ---------- */\nfunction pos(node,off){\n  const el=node.nodeType==3?node.parentElement:node;\n  if(node.nodeType==3){const s=el.closest('[data-o]');return s?+s.dataset.o+off:null}\n  i --line);padding:6px 14px}\n#guide .gv{font-size:12px;font-weight:500;color:var(--sub);margin-left:6px}\n#bot button.sm{display:flex;align-items:center;justify-content:center}\n#fi{padding:0 18px 14px;margin-bottom:12px;border-bottom:1px solid var(--line)}\n#fname{font-size:14px;font-weight:600;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#fcnt{display:flex;gap:14px;margin-top:2px;font-size:12px}\n#fcnt .c1{color:var(--org)}\n#fcnt .c2{color:var(--red);font-weight:700}\n#panel .r2 button.on{background:var(--fg);color:#fff;border-color:var(--fg)}\n<\/style>\n<\/head>\n<body class=\"view stage-all\">\n<div id=\"top\">\n  <button id=\"bToc\" aria-label=\"目次\"><i><\/i><i><\/i><i><\/i><\/button>\n  <div id=\"title\"><div id=\"name\"><span class=\"wm\"><b>Anki<\/b> <span class=\"sh\">Sheet<\/span><\/span><span class=\"mb\">Mobile<\/span><span class=\"ver\">v2.2<\/span><\/div><\/div>\n  <span class=\"grp\"><button id=\"mV\" class=\"on\">閲覧<\/button><button id=\"mE\">編集<\/button><\/span>\n  <button id=\"bMenu\">メニュー<\/button>\n<\/div>\n<div id=\"sheet\"><div id=\"empty\">「メニュー」から .txt を開く<\/div><\/div>\n<div id=\"hint\"><span id=\"hintV\">タップで表示／再タップで隠す<\/span><span id=\"hintE\">長押ししてなぞると範囲選択／色付きの語はタップで選択 → 下のボタンで変更<\/span><\/div>\n<div id=\"bot\">\n  <div class=\"g\" id=\"gv\">\n    <button id=\"bAll\" class=\"on\">すべて<\/button><button id=\"bImp\">重要語のみ<\/button><button id=\"bPeek\">全表示<\/button><button id=\"bRe\">隠し直し<\/button>\n  <\/div>\n  <div class=\"g\" id=\"ge\">\n    <button id=\"b1\" class=\"t1\">通常<\/button><button id=\"b2\" class=\"t2\">重要<\/button><button id=\"b0\">解除<\/button>\n    <button id=\"bUn\" class=\"sm\" aria-label=\"元に戻す\" title=\"元に戻す\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/><\/svg><\/button><button id=\"bRd\" class=\"sm\" aria-label=\"やり直す\" title=\"やり直す\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 14 5-5-5-5\"/><path d=\"M20 9H10a6 6 0 0 0 0 12h3\"/><\/svg><\/button>\n  <\/div>\n<\/div>\n<div id=\"drawer\"><div id=\"dp\"><div id=\"fi\"><div id=\"fname\"><\/div><div id=\"fcnt\"><\/div><\/div><div class=\"tt\">目次<\/div><div id=\"tocList\"><\/div><\/div><\/div>\n<div id=\"guide\" hidden><div class=\"gp\">\n  <div class=\"gh\"><h3>Anki Sheet の使い方 <small class=\"gv\">v2.2<\/small><\/h3><button id=\"gClose\">閉じる<\/button><\/div>\n  <p class=\"lead\">テキストファイル（.txt）から、赤シート式の暗記シートを作るツールです。覚えたい語に印を付けて隠し、思い出す練習ができます。内容は外部に送信されず、前回開いたファイルは次回自動で開きます。<\/p>\n\n  <h4><i>1<\/i>ファイルを開く<\/h4>\n  <p>「メニュー → ファイルを開く」で .txt を選びます。テキストをコピーしてある場合は「貼り付けて読み込む」でも入れられます。<\/p>\n\n  <h4><i>2<\/i>隠して覚える（閲覧モード）<\/h4>\n  <p>上の「閲覧」を選ぶと、印を付けた語が赤いシートで隠れます。<\/p>\n  <ul>\n    <li>「すべて」は通常語も重要語も隠し、「重要語のみ」は重要語だけ隠します<\/li>\n    <li>語をタップで表示、もう一度タップで隠します<\/li>\n    <li>「全表示」「隠し直し」で、まとめて切り替えられます<\/li>\n  <\/ul>\n\n  <h4><i>3<\/i>覚える語に印を付ける（編集モード）<\/h4>\n  <p>上の「編集」を選び、語を長押しして、そのまま指をなぞると範囲が選べます。下の <span class=\"o\">通常<\/span>（オレンジ）・<span class=\"r\">重要<\/span>（赤・太字）・解除のボタンで変更します。<\/p>\n  <ul>\n    <li>色の付いた語をタップすると、その語の範囲が選ばれます<\/li>\n    <li>間違えたら「戻す」「進む」で操作を取り消せます<\/li>\n  <\/ul>\n\n  <h4><i>4<\/i>見出しと目次<\/h4>\n  <p>行を <code>== 見出し ==<\/code> のように = で囲むと見出しになります。左上の ≡ ボタンで目次が開き、▾ で枝を折りたため、項目をタップするとその見出しへ移動します。<\/p>\n  <p>スマホ版では見出しを編集できません。PC版の「編集」モードか、.txt を直接編集してください。<\/p>\n\n  <h4><i>5<\/i>保存とPCとの共有<\/h4>\n  <p>編集内容は端末内に自動で記録されます。「メニュー → 共有・書き出し」で .txt として保存でき、PC版（Anki Sheet）で開けます。PCの .txt を iCloud や Google Drive に置けば、スマホからも開けます。<\/p>\n\n  <h4 class=\"plain\">.txt の書き方<\/h4>\n  <p><code>**通常の語**<\/code>　<code>***重要な語***<\/code>　<code>== 見出し ==<\/code><br>このように直接書いても、そのまま読み込まれます。<\/p>\n  <h4 class=\"plain\">表示モード<\/h4>\n  <p>端末に合わせて、PC向けとスマホ向けの表示が自動で切り替わります。「メニュー → 表示」で、自動・PC・スマホを選べます。<\/p>\n<\/div><\/div>\n<div id=\"menu\"><div id=\"panel\">\n  <button id=\"mOpen\">ファイルを開く<\/button>\n  <button id=\"mPasteBtn\">貼り付けて読み込む<\/button>\n  <textarea id=\"paste\" placeholder=\"ここに貼り付け\"><\/textarea>\n  <button id=\"mPasteGo\" style=\"display:none\">読み込む<\/button>\n  <button id=\"mShare\">共有・書き出し (.txt)<\/button>\n  <button id=\"mCopy\">テキストをコピー<\/button>\n  <button id=\"mGuide\">ヘルプ（使い方）<\/button>\n  <div class=\"r2\"><span>表示<\/span><span><button data-view=\"auto\">自動<\/button><button data-view=\"pc\">PC<\/button><button data-view=\"mobile\">スマホ<\/button><\/span><\/div>\n  \n  <div class=\"r2\"><span>文字サイズ<\/span><span><button id=\"fm\">小<\/button><button id=\"fp\">大<\/button><\/span><\/div>\n  <button id=\"mClose\" style=\"text-align:center;color:var(--sub);border:0\">閉じる<\/button>\n  <div id=\"note\">PCで作った .txt（**通常** / ***重要*** 形式）を iCloud・Google Drive などに置き、ここで開くと同期できます。編集後は「共有・書き出し」で戻せます。<\/div>\n<\/div><\/div>\n<input type=\"file\" id=\"file\" accept=\".txt,text/plain\" hidden>\n<script>\nconst $=id=>document.getElementById(id),sheet=$('sheet'),body=document.body;\nlet SEL=null;\nlet tocInit=false;\nconst S={docId:0,heads:{},name:'',text:'',marks:[],dirty:false,stage:'all',mode:'view'},H=[],F=[];\n\n/* storage */\nconst idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('anki-sheet-m',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});\nasync function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}}\nasync function kvSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch{}}\nconst persist=()=>kvSet('last',{name:S.name,src:serialize(),dirty:S.dirty,stage:S.stage,fs:parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))});\n\n/* parse / serialize */\nconst HR=/^\\s*(={1,6})\\s*(.+?)\\s*\\1\\s*$/;\nfunction parse(src){\n  src=src.replace(/^\\uFEFF/,'').replace(/\\r\\n?/g,'\\n');\n  const heads={},raw=src.split('\\n'),keep=[];let bh=false;\n  for(let i=raw.length-1;i>=0;i--){const l=raw[i];if(HR.test(l)){bh=true;keep.push(l)}else if(!l.trim()){if(!bh)keep.push(l)}else{bh=false;keep.push(l)}}\n  keep.reverse();\n  src=keep.map((ln,i)=>{const h=ln.match(HR);if(h){heads[i]=h[1].length;return h[2]}return ln}).join('\\n');\n  const re=/\\*\\*\\*([^\\n]+?)\\*\\*\\*|\\*\\*([^\\n]+?)\\*\\*/g;let t='',last=0,m,marks=[];\n  while((m=re.exec(src))){t+=src.slice(last,m.index);const w=m[1]??m[2];marks.push({s:t.length,e:t.length+w.length,l:m[1]!=null?2:1});t+=w;last=re.lastIndex}\n  return{text:t+src.slice(last),marks,heads};\n}\nfunction serialize(){let o='',c=0;for(const m of S.marks){const k=m.l==2?'***':'**';o+=S.text.slice(c,m.s)+k+S.text.slice(m.s,m.e)+k;c=m.e}o+=S.text.slice(c);\n  const hs=S.heads||{};if(!Object.keys(hs).length)return o;\n  const out=[];o.split('\\n').forEach((l,i)=>{if(hs[i]){if(i>0)out.push('');out.push('='.repeat(hs[i])+' '+l.trim()+' '+'='.repeat(hs[i]))}else out.push(l)});\n  return out.join('\\n');}\n\n/* render */\nconst esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction render(){\n  SEL=null;if(window.CSS&&CSS.highlights)CSS.highlights.delete('sel');\n  const{text,marks}=S;let h='',pos=0,mi=0,li=0;\n  for(const line of text.split('\\n')){\n    const ls=pos,le=pos+line.length;let c=ls;const hl=S.heads[li];h+=`<div class=\"ln${hl?' h h'+Math.min(hl,4):''}\" data-l=\"${ls}\"${hl?` data-i=\"${li}\"`:''}>`;\n    while(mi<marks.length&&marks[mi].s<le){const m=marks[mi++];if(m.s>c)h+=`<span data-o=\"${c}\">${esc(text.slice(c,m.s))}<\/span>`;\n      h+=`<span class=\"m m${m.l}\" data-o=\"${m.s}\">${esc(text.slice(m.s,m.e))}<\/span>`;c=m.e}\n    if(c<le)h+=`<span data-o=\"${c}\">${esc(text.slice(c,le))}<\/span>`;\n    if(!line)h+='<br>';h+='<\/div>';pos=le+1;li++;\n  }\n  const y=scrollY;sheet.innerHTML=h;scrollTo(0,y);info();\n}\nfunction setTitle(t){try{if(parent!==window&&parent.__shell&&parent.__shell.target!==MODE)return;parent.document.title=t}catch{document.title=t}}\nfunction info(){\n  const n1=S.marks.filter(m=>m.l==1).length;\n  $('fname').textContent=S.name?S.name+(S.dirty?' •':''):'ファイルが開かれていません';\n  $('fcnt').innerHTML=S.name?`<span class=\"c1\">通常 ${n1}<\/span><span class=\"c2\">重要 ${S.marks.length-n1}<\/span>`:'';\n  setTitle((S.dirty?'● ':'')+(S.name?S.name+' - ':'')+'Anki Sheet');\n}\n\n/* load */\nasync function decode(file){const b=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch{return new TextDecoder('shift_jis').decode(b)}}\nfunction load(src,name,keep){const p=parse(src);S.text=p.text;S.marks=p.marks;S.heads=p.heads;S.name=name;H.length=0;F.length=0;tocInit=false;if(!keep){S.dirty=false;S.docId=Math.random()}render();persist()}\n$('file').onchange=async e=>{const f=e.target.files[0];if(f){load(await decode(f),f.name);closeMenu()}e.target.value=''};\n\n/* selection (custom; no native menu) */\nfunction pos(node,off){\n  const el=node.nodeType==3?node.parentElement:node;\n  if(node.nodeType==3){const s=el.closest('[data-o]');return s?+s.dataset.o+off:null}\n  if(el.dataset.o!=null)return +el.dataset.o+(off?el.textContent.length:0);\n  if(el.classList.contains('ln')){const c=el.children[off];if(c&&c.dataset.o)return +c.dataset.o;const l=el.lastElementChild;return l&&l.dataset.o?+l.dataset.o+l.textContent.length:+el.dataset.l}\n  if(el===sheet){const c=sheet.children[off];return c?+c.dataset.l:S.text.length}\n  return null;\n}\nfunction segments(a,b){\n  const out=[];let p=a;\n  while(p<b){let e=S.text.indexOf('\\n',p);if(e<0||e>b)e=b;let x=p,y=e;\n    while(x<y&&/\\s/.test(S.text[x]))x++;while(y>x&&/\\s/.test(S.text[y-1]))y--;\n    if(y>x)out.push([x,y]);p=e+1}\n  return out;\n}\nfunction commit(before){\n  S.marks.sort((p,q)=>p.s-q.s);\n  if(JSON.stringify(S.marks)===before)return;\n  H.push(before);if(H.length>300)H.shift();F.length=0;S.dirty=true;render();persist();\n}\nfunction domPos(o){\n  const L=sheet.children;let lo=0,hi=L.length-1;\n  while(lo<hi){const k=(lo+hi+1)>>1;if(+L[k].dataset.l<=o)lo=k;else hi=k-1}\n  const ln=L[lo];\n  for(const sp of ln.children){if(sp.dataset.o==null)continue;const s=+sp.dataset.o,n=sp.firstChild.length;if(o<=s+n)return[sp.firstChild,Math.max(0,o-s)]}\n  return[ln,0];\n}\nfunction mkRange(a,b){const r=document.createRange(),A=domPos(a),B=domPos(b);r.setStart(A[0],A[1]);r.setEnd(B[0],B[1]);return r}\nfunction setSel(a,b){\n  SEL=a==null?null:[a,b];if(!window.CSS||!CSS.highlights)return;\n  if(SEL)CSS.highlights.set('sel',new Highlight(mkRange(a,b)));else CSS.highlights.delete('sel');\n}\nfunction charAt(x,y,loose){\n  let n,o;\n  if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){n=p.offsetNode;o=p.offset}}\n  else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){n=r.startContainer;o=r.startOffset}}\n  if(!n||!sheet.contains(n))return null;const p=pos(n,o);if(p==null)return null;\n  for(const i of[p,p-1]){\n    if(i<0||i>=S.text.length||S.text[i]==='\\n')continue;\n    for(const q of mkRange(i,i+1).getClientRects())if(x>=q.left-3&&x<=q.right+3&&y>=q.top-3&&y<=q.bottom+3)return i;\n  }\n  if(loose){const i=(p>=S.text.length||S.text[p]==='\\n')?p-1:p;return i>=0?i:null}\n  return null;\n}\nfunction selectMark(el){const m=S.marks.find(m=>m.s===+el.dataset.o);if(m)setSel(m.s,m.e)}\nfunction apply(lvl){\n  if(!SEL)return;const before=JSON.stringify(S.marks);\n  for(const[x,y]of segments(SEL[0],SEL[1])){\n    const ov=S.marks.filter(m=>m.s<y&&m.e>x);\n    if(ov.length===1&&ov[0].s<=x&&ov[0].e>=y){const m=ov[0];if(!lvl)S.marks.splice(S.marks.indexOf(m),1);else m.l=lvl}\n    else if(lvl){let s=x,e=y;for(const m of ov){s=Math.min(s,m.s);e=Math.max(e,m.e)}S.marks=S.marks.filter(m=>!ov.includes(m));S.marks.push({s,e,l:lvl})}\n    else S.marks=S.marks.filter(m=>!ov.includes(m));\n  }\n  commit(before);setSel(null);\n}\nfunction undo(){if(!H.length)return;F.push(JSON.stringify(S.marks));S.marks=JSON.parse(H.pop());S.dirty=true;render();persist()}\nfunction redo(){if(!F.length)return;H.push(JSON.stringify(S.marks));S.marks=JSON.parse(F.pop());S.dirty=true;render();persist()}\n\n/* view: tap to reveal */\nsheet.addEventListener('click',e=>{const el=e.target.closest('.m');if(el&&S.mode==='view')el.classList.toggle('r')});\ndocument.addEventListener('contextmenu',e=>{if(sheet.contains(e.target))e.preventDefault()});\n\n/* edit: long-press + drag (touch) */\nlet T=null;\nsheet.addEventListener('touchstart',e=>{\n  if(S.mode!=='edit'||e.touches.length>1){T=null;return}\n  const t=e.touches[0];T={x:t.clientX,y:t.clientY,mode:'wait',el:e.target.closest('.m')};\n  T.timer=setTimeout(()=>{\n    if(!T)return;const i=charAt(T.x,T.y);if(i==null){T.mode='scroll';return}\n    T.mode='sel';T.anchor=[i,i+1];setSel(i,i+1);navigator.vibrate&&navigator.vibrate(12);\n  },380);\n},{passive:true});\nsheet.addEventListener('touchmove',e=>{\n  if(!T)return;const t=e.touches[0];\n  if(T.mode==='wait'){if(Math.hypot(t.clientX-T.x,t.clientY-T.y)>10){clearTimeout(T.timer);T.mode='scroll'}return}\n  if(T.mode==='sel'){e.preventDefault();const i=charAt(t.clientX,t.clientY,1);if(i!=null)setSel(Math.min(T.anchor[0],i),Math.max(T.anchor[1],i+1))}\n},{passive:false});\nsheet.addEventListener('touchend',e=>{\n  if(!T)return;clearTimeout(T.timer);\n  if(T.mode==='wait'){if(T.el)selectMark(T.el);else setSel(null)}\n  if(T.mode!=='scroll'&&e.cancelable)e.preventDefault();\n  T=null;\n});\nsheet.addEventListener('touchcancel',()=>{if(T)clearTimeout(T.timer);T=null});\n\n/* edit: mouse (for PC browsers) */\nlet MD=null;\nsheet.addEventListener('mousedown',e=>{if(S.mode!=='edit'||e.button)return;MD={i:charAt(e.clientX,e.clientY),el:e.target.closest('.m'),moved:false}});\naddEventListener('mousemove',e=>{if(!MD||MD.i==null)return;const i=charAt(e.clientX,e.clientY,1);if(i==null)return;if(i!==MD.i)MD.moved=true;if(MD.moved)setSel(Math.min(MD.i,i),Math.max(MD.i,i)+1)});\naddEventListener('mouseup',()=>{if(!MD)return;if(!MD.moved){if(MD.el)selectMark(MD.el);else setSel(null)}MD=null});\n\n/* modes */\nfunction setMode(m){S.mode=m;body.classList.toggle('view',m==='view');body.classList.toggle('edit',m==='edit');$('mV').classList.toggle('on',m==='view');$('mE').classList.toggle('on',m==='edit');setSel(null)}\nfunction setStage(s){S.stage=s;body.classList.toggle('stage-all',s==='all');body.classList.toggle('stage-imp',s==='imp');$('bAll').classList.toggle('on',s==='all');$('bImp').classList.toggle('on',s==='imp');rehide();persist()}\nconst rehide=()=>sheet.querySelectorAll('.r').forEach(e=>e.classList.remove('r'));\n$('mV').onclick=()=>setMode('view');$('mE').onclick=()=>setMode('edit');\n$('bAll').onclick=()=>setStage('all');$('bImp').onclick=()=>setStage('imp');\n$('bPeek').onclick=()=>{body.classList.toggle('peek');$('bPeek').classList.toggle('on',body.classList.contains('peek'))};\n$('bRe').onclick=rehide;\nfor(const[id,fn]of[['b1',()=>apply(1)],['b2',()=>apply(2)],['b0',()=>apply(0)],['bUn',undo],['bRd',redo]]){\n  $(id).onclick=fn}\n\n/* TOC drawer */\nconst closeToc=()=>$('drawer').classList.remove('show'),colSet=new Set();\nfunction foldApply(){\n  let cut=null;\n  for(const a of $('tocList').querySelectorAll('a')){const lv=+a.dataset.lv;if(cut!==null&&lv>cut){a.classList.add('hid');continue}\n    cut=null;a.classList.remove('hid');const c=colSet.has(a.dataset.i);a.classList.toggle('closed',c);if(c)cut=lv}\n}\n$('bToc').onclick=()=>{\n  const hs=S.heads||{},ids=Object.keys(hs).map(Number).sort((a,b)=>a-b),L=$('tocList');\n  if(!ids.length)L.innerHTML='<p class=\"none\">見出しがありません<br><small>== 見出し == の形式で書きます<\/small><\/p>';\n  else{\n    const lines=S.text.split('\\n'),min=Math.min(...ids.map(i=>hs[i]));let cur=-1;\n  if(!tocInit){tocInit=true;colSet.clear();ids.forEach((i,n)=>{if(hs[i]===2&&ids[n+1]!==undefined&&hs[ids[n+1]]>2)colSet.add(String(i))})}\n\n    for(const i of ids){const el=sheet.querySelector(`.ln[data-i=\"${i}\"]`);if(el&&el.getBoundingClientRect().top<=120)cur=i}\n    L.innerHTML=ids.map((i,n)=>{const has=ids[n+1]!==undefined&&hs[ids[n+1]]>hs[i];\n      return `<a data-i=\"${i}\" data-lv=\"${hs[i]}\"${i===cur?' class=\"on\"':''} style=\"padding-left:${8+(hs[i]-min)*16}px\"><b class=\"tg${has?'':' none'}\"><\/b><span>${esc(lines[i])}<\/span><\/a>`}).join('');\n    foldApply();\n  }\n  $('drawer').classList.add('show');\n};\n$('drawer').onclick=e=>{\n  if(e.target.id==='drawer'){closeToc();return}\n  const a=e.target.closest('a');if(!a)return;\n  if(e.target.closest('.tg:not(.none)')){const i=a.dataset.i;colSet.has(i)?colSet.delete(i):colSet.add(i);foldApply();return}\n  closeToc();\n  const el=sheet.querySelector(`.ln[data-i=\"${a.dataset.i}\"]`);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),120);\n};\n\n/* menu */\nconst closeMenu=()=>{$('menu').classList.remove('show');$('paste').style.display=$('mPasteGo').style.display='none'};\n$('bMenu').onclick=()=>$('menu').classList.add('show');\n$('mClose').onclick=closeMenu;$('menu').onclick=e=>{if(e.target.id==='menu')closeMenu()};\n$('mGuide').onclick=()=>{closeMenu();$('guide').hidden=false};\n$('gClose').onclick=()=>{$('guide').hidden=true};\n$('guide').onclick=e=>{if(e.target.id==='guide')$('guide').hidden=true};\n$('mOpen').onclick=()=>$('file').click();\n$('mPasteBtn').onclick=()=>{$('paste').style.display='block';$('mPasteGo').style.display='block';$('paste').focus()};\n$('mPasteGo').onclick=()=>{const v=$('paste').value;if(v.trim()){load(v,'pasted.txt');$('paste').value='';closeMenu()}};\n$('mCopy').onclick=async()=>{try{await navigator.clipboard.writeText(serialize());$('mCopy').textContent='コピーしました'}catch{$('mCopy').textContent='コピーできませんでした'}setTimeout(()=>$('mCopy').textContent='テキストをコピー',1500)};\n$('mShare').onclick=async()=>{\n  if(!S.name)return;const name=S.name.endsWith('.txt')?S.name:S.name+'.txt',f=new File([serialize()],name,{type:'text/plain'});\n  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});S.dirty=false;info();persist();closeMenu();return}}catch(e){if(e.name==='AbortError')return}\n  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();S.dirty=false;info();persist();closeMenu();\n};\nconst setFs=n=>{document.documentElement.style.setProperty('--fs',Math.max(13,Math.min(30,n))+'px');persist()};\n$('fm').onclick=()=>setFs(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))-1);\n$('fp').onclick=()=>setFs(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))+1);\n\n/* startup: reopen last */\nwindow.__ready=(async()=>{\n  const r=await kvGet('last');if(!r)return;\n  if(r.fs)document.documentElement.style.setProperty('--fs',r.fs+'px');\n  setStage(r.stage||'all');S.dirty=!!r.dirty;load(r.src,r.name,true);\n})();\n/* ---------- 統合シェルとの連携 ---------- */\nconst MODE='m';\nwindow.__anki={\n  get(){return{name:S.name,src:serialize(),dirty:S.dirty,stage:S.stage,docId:S.docId}},\n  set(st){if(!st.name&&!st.src)return;setStage(st.stage||'all');S.dirty=!!st.dirty;S.docId=st.docId;load(st.src,st.name,true)},\n  showGuide(){$('guide').hidden=false},\n  viewChanged(v){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));}\n};\ndocument.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{closeMenu();try{if(parent!==window)parent.__shell.setView(b.dataset.view)}catch{}}));\ntry{window.__anki.viewChanged(parent.__shell.getView())}catch{}\n<\/script>\n<\/body>\n<\/html>\n"};
const KEY='ankiView',last={pc:null,m:null};
const sh=window.__shell={
  target:null,frames:{},reason:'',
  getView(){try{return localStorage.getItem(KEY)||'auto'}catch{return 'auto'}},
  setView(v){try{localStorage.setItem(KEY,v)}catch{}apply()}
};
/* 端末の判別（Wikipedia・YouTube と同じく、User-Agent を主な根拠にする）
   1) Client Hints（Chrome・Edge）  2) User-Agent の文字列  3) どちらも不明なときだけ、入力方法 */
function detect(){
  const set=(code,label)=>{sh.reason=(code==='m'?'スマホ':'PC')+(label?'（'+label+'）':'');return code};
  const ua=navigator.userAgent||'',uad=navigator.userAgentData,tp=navigator.maxTouchPoints||0;
  try{
    if(uad&&typeof uad.mobile==='boolean'){
      const pf=uad.platform||'';
      if(uad.mobile)return set('m',pf||'モバイル');
      if(/^(Android|iOS)$/i.test(pf))return set('m',pf+'・タブレット');
      if(pf)return set('pc',pf);
    }
    if(/iPhone|iPod/.test(ua))return set('m','iPhone');
    if(/iPad/.test(ua))return set('m','iPad');
    if(/Android/.test(ua))return set('m','Android');
    if(/Windows Phone|IEMobile|BlackBerry|Opera Mini|\bMobi/i.test(ua))return set('m','モバイル');
    if(/Macintosh/.test(ua)&&tp>1)return set('m','iPad');
    if(/Windows NT/.test(ua))return set('pc','Windows');
    if(/Macintosh/.test(ua))return set('pc','macOS');
    if(/CrOS/.test(ua))return set('pc','ChromeOS');
    if(/X11|Linux/.test(ua))return set('pc','Linux');
    if(matchMedia('(pointer: coarse)').matches&&matchMedia('(hover: none)').matches)return set('m','タッチ操作');
  }catch{}
  return set('pc','');
}
const want=()=>{const v=sh.getView();if(v==='pc'){sh.reason='PC';return 'pc'}if(v==='mobile'){sh.reason='スマホ';return 'm'}return detect()};
function mk(mode){
  return new Promise(res=>{
    const f=document.createElement('iframe');
    f.setAttribute('allow','clipboard-read; clipboard-write; web-share');
    f.style.visibility='hidden';
    f.addEventListener('load',()=>res(f),{once:true});
    f.srcdoc=APPS[mode];sh.frames[mode]=f;document.body.appendChild(f);
  });
}
function merge(st,mode){
  const o={...st};
  if(mode==='pc'){const p=last.pc;if(p&&p.docId===st.docId){o.handle=p.handle;o.mtime=p.mtime;o.baseSrc=p.baseSrc}else{o.handle=null;o.mtime=0;o.baseSrc=null}}
  else o.handle=null;
  return o;
}
function notify(){for(const k in sh.frames){try{sh.frames[k].contentWindow.__anki.viewChanged(sh.getView())}catch{}}}
async function doApply(){
  const w=want(),from=sh.target;
  if(from===w){notify();return}
  let st=null;
  if(from&&sh.frames[from]){st=sh.frames[from].contentWindow.__anki.get();last[from]=st}
  sh.target=w;
  const fresh=!sh.frames[w];
  if(fresh){await mk(w);try{await sh.frames[w].contentWindow.__ready}catch{}}
  const f=sh.frames[w];
  if(st){try{await f.contentWindow.__ready;f.contentWindow.__anki.set(merge(st,w))}catch{}}
  f.hidden=false;f.style.visibility='';
  for(const k in sh.frames)if(k!==w)sh.frames[k].hidden=true;
  try{f.contentWindow.focus()}catch{}
  notify();
}
let chain=Promise.resolve();
function apply(){chain=chain.then(doApply).catch(()=>{});return chain}
apply().then(()=>{   // 初回アクセス時だけ、ヘルプ（使い方）を自動で開く
  try{if(localStorage.getItem('ankiHelpSeen'))return;localStorage.setItem('ankiHelpSeen','1')}catch{return}
  try{sh.frames[sh.target].contentWindow.__anki.showGuide()}catch{}
});
