lative}\n.pcs label:has(input:checked){border-color:var(--fg);background:#f4f0e8}\n.pcs input{position:absolute;opacity:0;pointer-events:none}\n.pcs .t{font-weight:600}.pcs .ex{font-size:13px;line-height:1.7}\n@media print{\n@page{margin:14mm}\nhtml,body{background:#fff!important}\n*{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none!important}\n#bar,#toc,#foot,#toast,#help,#guide,#conflict,#conv,#lkd,#empty,#fmenu,#drawer,#recentList{display:none!important}\n#wrap{display:block;padding:0;gap:0}\n#sheet,#ed{max-width:none;width:auto;flex:none;padding:0;margin:0;border:0;border-radius:0;box-shadow:none;background:#fff;min-height:0;caret-color:transparent}\n.cm,.ln[data-co]{display:none!important}\n.ln{break-inside:avoid}\n.ln[data-t^=\"h\"]:not([data-t=\"hr\"]){break-after:avoid}\na,.lk,.url{color:inherit!important}\n\n.m1,.edit .m1,#ed .m1{color:#000;border-bottom:2px dashed #000;padding-bottom:1px}\n.m2,.edit .m2,#ed .m2{color:#000;font-weight:700;border-bottom:3px solid #000;padding-bottom:1px}\nbody.pc-color .m1,body.pc-color #ed .m1{color:var(--org);border-bottom:2px solid var(--org)}\nbody.pc-color .m2,body.pc-color #ed .m2{color:var(--red);font-weight:700;border-bottom:3px solid var(--red)}\n.view.stage-all:not(.peek) .m1:not(.r),.view.stage-all:not(.peek) .m2:not(.r),.view.stage-imp:not(.peek) .m2:not(.r){background:none!important;color:transparent!important;box-shadow:none}\n#src{display:none!important}.edit.src #sheet{display:block!important}\n}\n<\/style>\n<\/head>\n<body class=\"view stage-all\">\n<div id=\"bar\">\n  <button id=\"bToc\" aria-label=\"目次\"><i><\/i><i><\/i><i><\/i><\/button><span id=\"brand\"><span class=\"wm\"><b>Anki<\/b> <span class=\"sh\">Sheet<\/span><\/span><span class=\"ver\">v3.5<\/span><\/span><span id=\"name\"><\/span><span id=\"info\"><\/span>\n  <span class=\"sp\"><\/span>\n  <span class=\"grp view-only\"><button id=\"bAll\" class=\"on\">すべて<\/button><button id=\"bImp\">重要語のみ<\/button><span class=\"k hk\">H<\/span><\/span>\n  <button id=\"bPeek\" class=\"view-only\">全表示<span class=\"k\">S<\/span><\/button>\n  <span class=\"grp edit-only\"><button id=\"b1\" class=\"t1\">通常<\/button><button id=\"b2\" class=\"t2\">重要<\/button><button id=\"b0\">解除<\/button><\/span>\n  <span class=\"grp edit-only\"><span class=\"gl\">行の種類<\/span><span class=\"menuwrap\"><button id=\"hsel\" class=\"ddb\"><span id=\"hlabel\">本文<\/span><i class=\"cv\"><\/i><\/button><div id=\"hmenu\" hidden><button data-v=\"p\" class=\"cur\"><span>本文<\/span><span class=\"sc\">Ctrl+Alt+0<\/span><\/button><button data-v=\"h1\"><span>見出し1<\/span><span class=\"sc\">Ctrl+Alt+1<\/span><\/button><button data-v=\"h2\"><span>見出し2<\/span><span class=\"sc\">Ctrl+Alt+2<\/span><\/button><button data-v=\"h3\"><span>見出し3<\/span><span class=\"sc\">Ctrl+Alt+3<\/span><\/button><button data-v=\"h4\"><span>見出し4<\/span><span class=\"sc\">Ctrl+Alt+4<\/span><\/button><button data-v=\"h5\"><span>見出し5<\/span><span class=\"sc\">Ctrl+Alt+5<\/span><\/button><button data-v=\"h6\"><span>見出し6<\/span><span class=\"sc\">Ctrl+Alt+6<\/span><\/button><\/div><\/span><\/span><span class=\"grp edit-only\"><span class=\"menuwrap\"><button id=\"bMore\" title=\"書式・挿入（もう一度押すまで表示）\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.9\"/><circle cx=\"12\" cy=\"12\" r=\"1.9\"/><circle cx=\"19\" cy=\"12\" r=\"1.9\"/><\/svg><\/button><div id=\"ibar\" hidden><button data-k=\"f:b\" title=\"太字 Ctrl+B\"><span class=\"tx\"><b>B<\/b><\/span><\/button><button data-k=\"f:i\" title=\"斜体 Ctrl+I\"><span class=\"tx\"><i>I<\/i><\/span><\/button><button data-k=\"f:u\" title=\"下線 Ctrl+U\"><span class=\"tx\"><u>U<\/u><\/span><\/button><button data-k=\"f:s\" title=\"取り消し線 Ctrl+Shift+X\"><span class=\"tx\"><s>S<\/s><\/span><\/button><button data-k=\"f:su\" title=\"上付き Ctrl+.\"><span class=\"tx\">x<sup>2<\/sup><\/span><\/button><button data-k=\"f:sb\" title=\"下付き Ctrl+,\"><span class=\"tx\">x<sub>2<\/sub><\/span><\/button><span class=\"sep\"><\ =\"bOpen\"><span>開く<\/span><span class=\"sc\">Ctrl+O<\/span><\/button>\n      <button id=\"bRecent\"><span>最近開いたファイル<\/span><span class=\"sc\">◂<\/span><\/button>\n      <hr>\n      <button id=\"bSave\"><span>保存<\/span><span class=\"sc\">Ctrl+S<\/span><\/button>\n      <button id=\"bSaveAs\"><span>名前を付けて保存<\/span><span class=\"sc\">Ctrl+Shift+S<\/span><\/button>\n      <button id=\"bCopy\"><span>コピー<\/span><\/button>\n      <button id=\"bPrint\"><span>印刷<\/span><span class=\"sc\">Ctrl+P<\/span><\/button>\n      <hr>\n      <button id=\"bHelp\"><span>ショートカット<\/span><span class=\"sc\">Ctrl+/<\/span><\/button>\n      <button id=\"bGuide\"><span>ヘルプ<\/span><\/button>\n      <hr>\n      <div class=\"vrow\"><span>表示<\/span><span class=\"grp vseg\"><button data-view=\"auto\">自動<\/button><button data-view=\"pc\">PC<\/button><button data-view=\"mobile\">スマホ<\/button><\/span><\/div>\n      \n    <\/div>\n  <\/span>\n<\/div>\n<div id=\"wrap\"><nav id=\"toc\" hidden><\/nav><div id=\"sheet\" tabindex=\"-1\"><div id=\"empty\">.md をここにドロップ、または Ctrl+O<\/div><\/div><div id=\"ed\" contenteditable=\"true\" spellcheck=\"false\"><\/div><div id=\"src\" contenteditable=\"true\" spellcheck=\"false\" autocorrect=\"off\" autocapitalize=\"off\"><\/div><\/div>\n<div id=\"foot\">見出しは <b># 見出し<\/b>、語は <b>==通常==<\/b> <b>===重要===<\/b> の形で、Markdown（.md）として保存されます（編集は見た目のまま行えます）<\/div>\n<div id=\"help\" hidden><div class=\"card\">\n  <h3>ショートカット<\/h3>\n  <div class=\"cols\">\n    <div>\n      <h4>共通<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>O<\/kbd>ファイルを開く<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>S<\/kbd>保存<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Shift<\/kbd><kbd>S<\/kbd>名前を付けて保存<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>P<\/kbd>印刷<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>/<\/kbd>この一覧<\/p>\n      <p><kbd>E<\/kbd>編集モードへ（閲覧中）<\/p>\n      <p><kbd>Esc<\/kbd>閲覧モードへ（編集中）<\/p>\n      <h4>閲覧<\/h4>\n      <p><kbd>Space<\/kbd>次の語を表示<\/p>\n      <p><kbd>Shift<\/kbd><kbd>Space<\/kbd>1つ戻す<\/p>\n      <p><kbd>H<\/kbd>段階を切替<\/p>\n      <p><kbd>S<\/kbd>全表示<\/p>\n      <p><kbd>R<\/kbd>隠し直し<\/p>\n      <p><kbd>クリック<\/kbd>その語だけ表示<\/p>\n    <\/div>\n    <div>\n      <h4>編集：印<\/h4>\n      <p><kbd>Alt<\/kbd><kbd>1<\/kbd>通常<\/p>\n      <p><kbd>Alt<\/kbd><kbd>2<\/kbd>重要<\/p>\n      <p><kbd>Alt<\/kbd><kbd>3<\/kbd>解除<\/p>\n      <p><kbd>ドラッグ<\/kbd>ツール選択中は自動適用<\/p>\n      <h4>編集：書式（文字を選んで）<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>B<\/kbd>太字<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>I<\/kbd>斜体<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>U<\/kbd>下線<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Shift<\/kbd><kbd>X<\/kbd>取り消し線<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>.<\/kbd>上付き　<kbd>Ctrl<\/kbd><kbd>,<\/kbd>下付き<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>K<\/kbd>リンク<\/p>\n      <p><kbd>Alt<\/kbd><kbd>4<\/kbd>コメント<\/p>\n      <h4>編集：行の種類<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>Alt<\/kbd><kbd>0<\/kbd>本文<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Alt<\/kbd><kbd>1〜6<\/kbd>見出し1〜6<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Shift<\/kbd><kbd>8<\/kbd>箇条書き<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Shift<\/kbd><kbd>7<\/kbd>番号付きリスト<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Shift<\/kbd><kbd>9<\/kbd>引用<\/p>\n      <p><kbd>Tab<\/kbd> / <kbd>Shift<\/kbd><kbd>Tab<\/kbd>リストの字下げ<\/p>\n      <h4>編集：操作<\/h4>\n      <p><kbd>Ctrl<\/kbd><kbd>Z<\/kbd>取り消し<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>Y<\/kbd>やり直し<\/p>\n      <p><kbd>Ctrl<\/kbd><kbd>クリック<\/kbd>リンクを開く<\/p>\n    <\/div>\n  <\/div>\n<\/div><\/div>\n<div id=\"guide\" hidden><div class=\"card\">\n  <div class=\"gh\"><h3>Anki Sheet の使い方 <small class=\"gv\">v3.5<\/small><\/h3><button id=\"gClose\">閉じる<\/button><\/div>\n  <p class=\"lead\">Markdown（.md）ファイルから、赤シート式の暗記シートを作るツールです。覚えたい語に印を付けて隠し、思い出す練習ができます。ブラウザだけで動き、内容は外部に送信されません。前回開いたファイルは、次回起動時に自動で開きます。<\/p>\n  <p class=\"lead\"><b>v3.0 から、ファイル形式が .txt から .md（Markdown）に変更になりました。<\/b><\/p>\n\n  <h4><i>1<\/i>ファイルを開く<\/h4>\n  <p>「メニュー → 開く」（<kbd>Ctrl+O<\/kbd>）を使うか、.md をウィンドウにドラッグ＆ドロップします。<\/p>\n  <p>従来の <b>.txt<\/b> を開くと変換のダイアログが出て、.md に変換したファイルを書き出せます（元の .txt は変更されません）。<\/p>\n\n  <h4><i>2<\/i>編集する（編集モード）<\/h4>\n  <p>上部の「編集」に切り替える（<kbd>E<\/kbd>）と、見た目のまま文章を書き換えられます。印を付けた語は、通常が <span class=\"o\">オレンジ<\/span>、重要が <span class=\"r\">赤・太字<\/span> で表示されます。<\/p>\n  <ul>\n    <li>語を選び、「通常」「重要」「解除」のボタン（<kbd>Alt+1<\/kbd> / <kbd>Alt+2<\/kbd> / <kbd>Alt+3<\/kbd>）で印を付け外しします<\/li>\n    <li>範囲を選ばずにボタンを押すと、そのツールが選択中になり、ドラッグで範囲を選んだ時点ですぐ適用されます（もう一度押すと外れます）<\/li>\n    <li>上のバーの <b>⋯<\/b> を押すと、太字・斜体・下線・取り消し線・上付き・下付き、リンク、コメント、箇条書き、番号付きリスト、引用、水平線のアイコンが開きます（文字や行を選んで操作）。もう一度 ⋯ を押すまで表示されたままです。各アイコンにカーソルを合わせると、ショートカットが出ます<\/li>\n    <li>見出しは、「行の種類」から本文・見出し1〜6を選びます<\/li>\n    <li>上の「ビジュアル／ソース」で、編集画面を切り替えられます。「ソース」では Markdown を直接書けます（見た目はビジュアルとほぼ同じで、<code>#<\/code> や <code>==<\/code> などの記号が薄く表示されます）<\/li>\n    <li><kbd>Ctrl+Z<\/kbd> で取り消し、<kbd>Esc<\/kbd> で閲覧モードに戻ります<\/li>\n  <\/ul>\n\n  <h4><i>3<\/i>隠して覚える（閲覧モード）<\/h4>\n  <p>「閲覧」に切り替えると、印を付けた語が赤いシートで隠れます。<\/p>\n  <ul>\n    <li>「すべて」は通常語も重要語も隠し、「重要語のみ」は重要語だけを隠します（<kbd>H<\/kbd> で切替）<\/li>\n    <li>語をクリックすると、その語だけ表示されます<\/li>\n    <li><kbd>Space<\/kbd> で次の語を順に表示、<kbd>Shift+Space<\/kbd> で1つ戻します<\/li>\n    <li><kbd>S<\/kbd> で全表示、<kbd>R<\/kbd> で隠し直します<\/li>\n  <\/ul>\n\n  <h4><i>4<\/i>見出しと目次<\/h4>\n  <p>行頭に <code># <\/code>〜<code>###### <\/code> を付けると見出し1〜6になり、左側に目次が出ます。# の数が多いほど下の階層です。目次の ▾ で枝を、「目次」の文字で全体を折りたためます。ウィンドウが狭くて目次が隠れるときは、左上の ☰ から開けます。<\/p>\n\n  <h4><i>5<\/i>保存とスマホ版<\/h4>\n  <p>編集内容はブラウザ内に自動で記録され、<kbd>Ctrl+S<\/kbd> で元の .md に書き込めます。「コピー」で印付きのテキストをコピーして、スマホ版に貼り付けることもできます。<\/p>\n  <p>「メニュー」から、新しいファイルの作成、名前を付けて保存、最近開いたファイルの再表示ができます（最近のファイルは Chrome / Edge のみ）。<\/p>\n  <p>「印刷」（<kbd>Ctrl+P<\/kbd>）では、カラーか白黒かを選んで、文章だけを出力します。隠している語は下線だけが印字されるので、上から手書きで書き込めます。表示中の語は、カラーでは色つき、白黒では通常が破線・重要が実線の下線（太字）になります。現在の表示（すべて／重要語のみ／全表示／表示した語）がそのまま反映されます。<\/p>\n\n  <h4 class=\"plain\">.md の書き方<\/h4>\n  <ul>\n    <li>印：<code>==通常==<\/code>　<code>===重要===<\/code><\/li>\n    <li>見出し：<code># 見出し1<\/code> 〜 <code>###### 見出し6<\/code><\/li>\n    <li>太字 <code>**太字**<\/code>　斜体 <code>*斜体*<\/code>　取り消し線 <code>~~取り消し~~<\/code>　下線 <code>__下線__<\/code><\/li>\n    <li>上付き <code>&lt;sup&gt;2&lt;/sup&gt;<\/code>　下付き <code>&lt;sub&gt;2&lt;/sub&gt;<\/code><\/li>\n    <li>箇条書き <code>- 項目<\/code>（字下げで入れ子）　番号付き <code>1. 項目<\/code>　引用 <code>&gt; 引用<\/code>　水平線 <code>---<\/code><\/li>\n    <li>リンク <code>[表示](https://…)<\/code>　URL はそのままでもリンクになります　ページ内リンク <code>[表示](#見出し名)<\/code><\/li>\n    <li>記号をそのまま出す：<code>\\*<\/code> <code>\\#<\/code> <code>\\_<\/code> のように、前に <code>\\<\/code> を付けます（編集モードでは自動で付きます）<\/li>\n    <li>コメント：<code>&lt;!-- メモ --&gt;<\/code>（編集モードでは灰色で表示、閲覧モードでは非表示）<\/li>\n  <\/ul>\n  <h4 class=\"plain\">表示モード<\/h4>\n  <p>端末に合わせて、PC向けとスマホ向けの表示が自動で切り替わります。「メニュー → 表示」で、自動・PC・スマホを選べます。<\/p>\n<\/div><\/div>\n<div id=\"conflict\" hidden><div class=\"card\">\n  <h3>ファイルが外部で更新されました<\/h3>\n  <p>元のファイル「<b id=\"cName\"><\/b>」が、このページ以外で変更されました。ページ上には、まだ保存していない編集があります。<\/p>\n  <p>どちらの内容を残しますか？「ファイルの内容に置き換える」を選ぶと、ページ上の編集は失われます。<\/p>\n  <div class=\"cb\"><button id=\"cMine\">ページの編集を残す<\/button><button id=\"cFile\" class=\"solid\">ファイルの内容に置き換える<\/button><\/div>\n<\/div><\/div>\n<div id=\"lkd\" hidden><div class=\"card\"><h3>リンクを挿入<\/h3>\n<label for=\"lkText\">テキスト<\/label><input id=\"lkText\" type=\"text\" autocomplete=\"off\" placeholder=\"表示する文字\">\n<label for=\"lkUrl\">リンク先<\/label><input id=\"lkUrl\" type=\"text\" autocomplete=\"off\" placeholder=\"https://…（下の見出しを選ぶとページ内リンク）\" spellcheck=\"false\">\n<label>ページ内の見出し<\/label><div id=\"lkHeads\"><\/div><div id=\"lkErr\"><\/div>\n<div class=\"cb\"><button id=\"lkDel\" hidden>リンクを削除<\/button><span class=\"sp\"><\/span><button id=\"lkCancel\">キャンセル<\/button><button id=\"lkOk\" class=\"solid\">適用<\/button><\/div><\/div><\/div>\n<div id=\"conv\" hidden><div class=\"card\"><h3 id=\"cvT\"><\/h3><div id=\"cvB\"><\/div><div class=\"cb\" id=\"cvBtns\"><\/div><\/div><\/div>\n<div id=\"recentList\" hidden><\/div>\n<div id=\"drawer\"><div id=\"dp\"><div id=\"dpFi\"><div id=\"dpName\"><\/div><div id=\"dpCnt\"><\/div><\/div><div class=\"tt\">目次<\/div><div id=\"dpList\"><\/div><\/div><\/div>\n<div id=\"toast\"><\/div>\n<input type=\"file\" id=\"file\" accept=\".md,.markdown,.txt,text/markdown,text/plain\" hidden>\n<script>\n/* ===== core: 文書モデル / Markdown の読み書き ===== */\n/* 文書 = 行の配列。行 = {t:種類, d:字下げ, r:[run]}、run = {t:文字, f:装飾ビット, m:印(0/1/2), h:リンク先} */\nconst FB=1,FI=2,FS=4,FU=8,FP=16,FQ=32,FC=64;\nconst FLAGS=[['b',FB],['i',FI],['s',FS],['u',FU],['su',FP],['sb',FQ],['cm',FC]];\nconst BTYPE=/^(p|h[1-6]|ul|ol|q|hr)$/,HRE=/^h[1-6]$/,MAXD=4;\nconst HSEL=[1,2,3,4,5,6].map(n=>`.ln[data-t=\"h${n}\"]`).join(',');\nconst isHead=t=>HRE.test(t),isList=t=>t==='ul'||t==='ol';\nconst lineText=l=>l.r.map(r=>r.t).join('');\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst newLine=(t='p')=>({t,d:0,r:[]});\n\nfunction mergeRuns(rs){const o=[];for(const r of rs){if(!r.t)continue;const p=o[o.length-1];if(p&&p.f===r.f&&p.m===r.m&&p.h===r.h)p.t+=r.t;else o.push({t:r.t,f:r.f,m:r.m,h:r.h})}return o}\n\n/* 太字・印などの範囲の端にある空白は、記号の外へ出す（Markdown で正しく読まれるため） */\nfunction trimFlank(rs){\n  const cs=[];for(const r of rs)for(const c of r.t)cs.push({c,f:r.f,m:r.m,h:r.h});\n  const ws=c=>/\\s/.test(c);\n  const pass=(get,clr)=>{let i=0;while(i<cs.length){const v=get(cs[i]);if(!v){i++;continue}let j=i;while(j<cs.length&&get(cs[j])===v)j++;\n    let a=i,b=j;while(a<b&&ws(cs[a].c))a++;while(b>a&&ws(cs[b-1].c))b--;\n    for(let k=i;k<a;k++)clr(cs[k]);for(let k=b;k<j;k++)clr(cs[k]);i=j}};\n  for(const bit of [FB,FI,FS,FU])pass(x=>x.f&FC?0:(x.f&bit),x=>{x.f&=~bit});\n  pass(x=>x.m,x=>{x.m=0});\n  return mergeRuns(cs.map(x=>({t:x.c,f:x.f,m:x.m,h:x.h})));\n}\n\n/* ---------- URL / リンク ---------- */\nconst urlEnd=u=>u.replace(/[.,;:!?)'\"。、）」』】]+$/,'');\nfunction splitUrl(t){\n  const out=[],re=/https?:\\/\\/[^\\s<>\\[\\]]+/g;let last=0,m;\n  while((m=re.exec(t))){const u=urlEnd(m[0]);if(u.length<9)continue;\n    if(m.index>last)out.push([t.slice(last,m.index),0]);out.push([u,1]);last=m.index+u.length;re.lastIndex=last}\n  if(last<t.length)out.push([t.slice(last),0]);\n  return out.length?out:[[t,0]];\n}\nconst safeHref=h=>{h=(h||'').trim();return /^(https?:\\/\\/|mailto:|#)/i.test(h)?h:''};\nconst slugify=s=>s.trim().toLowerCase().replace(/[^\\p{L}\\p{N}\\p{M}\\s_-]/gu,'').replace(/\\s+/g,'-');\nfunction slugMap(L){ // 見出しのスラッグ → 行番号（重複は -1, -2 …）\n  const mp={},cnt={};L.forEach((l,i)=>{if(!isHead(l.t))return;let sg=slugify(lineText(l))||'h';const k=cnt[sg]=(cnt[sg]??-1)+1;if(k)sg+='-'+k;mp[sg]=i});return mp;\n}\n\n/* ---------- インライン解析 ---------- */\nconst ESCP='\\\\`*_{}[]()#+-.!~=<>|/:;\"\\'&%$@^,?';\nconst LINKRE=/^\\[((?:\\\\.|[^\\]\\\\\\n])+)\\]\\(([^)\\s]+)\\)/;\nconst DBIT={'**':FB,'*':FI,'~~':FS,'__':FU,sup:FP,sub:FQ},LIT={sup:'<sup>',sub:'<sub>'};\nconst parseInline=s=>mergeRuns(inl(s));\nfunction inl(s){\n  const toks=[],stack=[];let buf='',i=0;\n  const flush=()=>{if(buf){toks.push({k:'t',v:buf});buf=''}};\n  const sp=c=>c===undefined||/\\s/.test(c);\n  const open=d=>{flush();const tk={k:'d',d,on:false,cl:false};toks.push(tk);stack.push({d,tk})};\n  const close=d=>{for(let j=stack.length-1;j>=0;j--)if(stack[j].d===d){stack[j].tk.on=true;stack.length=j;flush();toks.push({k:'d',d,on:true,cl:true});return true}return false};\n  while(i<s.length){\n    const c=s[i];\n    if(c==='\\\\'&&i+1<s.length&&ESCP.includes(s[i+1])){buf+=s[i+1];i+=2;continue}\n    if(c==='<'){\n      if(s.startsWith('<\!--',i)){const e=s.indexOf('-->',i+4);if(e>0){flush();toks.push({k:'c',v:s.slice(i+4,e).replace(/^ | $/g,'')});i=e+3;continue}}\n      const m=/^<(\\/?)(sup|sub)>/i.exec(s.slice(i,i+7));\n      if(m){const d=m[2].toLowerCase();if(!m[1])open(d);else if(!close(d))buf+=m[0];i+=m[0].length;continue}\n    }\n    if(c==='['){const m=LINKRE.exec(s.slice(i));if(m){flush();toks.push({k:'l',label:m[1],href:m[2]});i+=m[0].length;continue}}\n    if(c==='h'&&(s.startsWith('http://',i)||s.startsWith('https://',i))){\n      const m=/^https?:\\/\\/[^\\s<>\\[\\]]+/.exec(s.slice(i));\n      if(m){const u=urlEnd(m[0]);if(u.length>=9){buf+=u;i+=u.length;continue}}\n    }\n    if(c==='*'||c==='_'||c==='~'||c==='='){\n      let L=1;while(s[i+L]===c)L++;\n      const prevSp=sp(s[i-1]),nextSp=sp(s[i+L]);\n      if(c==='*'){\n        let rest=L;\n        while(rest>0&&!prevSp){const top=stack[stack.length-1];\n          if(top&&(top.d==='**'||top.d==='*')&&rest>=top.d.length){flush();top.tk.on=true;stack.pop();toks.push({k:'d',d:top.d,on:true,cl:true});rest-=top.d.length}else break}\n        if(rest>0){if(rest<=3&&!nextSp){while(rest>=2){open('**');rest-=2}if(rest===1)open('*')}else buf+='*'.repeat(rest)}\n      }else{\n        const d=c==='='?(L===2?'==':L===3?'===':null):(L===2?c+c:null);\n        if(!d)buf+=c.repeat(L);\n        else if(!prevSp&&close(d)){}\n        else if(!nextSp)open(d);\n        else buf+=c.repeat(L);\n      }\n      i+=L;continue;\n    }\n    buf+=c;i++;\n  }\n  flush();\n  const runs=[],act={};\n  const curF=()=>{let f=0;for(const k in DBIT)if(act[k]>0)f|=DBIT[k];return f};\n  const curM=()=>act['===']>0?2:act['==']>0?1:0;\n  for(const tk of toks){\n    if(tk.k==='t')runs.push({t:tk.v,f:curF(),m:curM(),h:''});\n    else if(tk.k==='c')runs.push({t:tk.v,f:FC,m:0,h:''});\n    else if(tk.k==='l'){\n      const href=safeHref(tk.href.replace(/%20/g,' ').replace(/%29/g,')'));\n      for(const r of inl(tk.label))runs.push({t:r.t,f:(r.f&FC)?FC:(r.f|curF()),m:(r.f&FC)?0:(r.m||curM()),h:(r.f&FC)?'':href});\n    }else{\n      if(!tk.on){runs.push({t:LIT[tk.d]||tk.d,f:curF(),m:curM(),h:''});continue}\n      act[tk.d]=(act[tk.d]||0)+(tk.cl?-1:1);\n    }\n  }\n  return runs;\n}\n\n/* ---------- ブロック解析（.md） ---------- */\nfunction parseMd(src,mp){\n  src=src.replace(/^\\uFEFF/,'').replace(/\\r\\n?/g,'\\n').replace(/<\!--([\\s\\S]*?)-->/g,(m,c)=>c.includes('\\n')?c.split('\\n').map(x=>'<\!--'+x+'-->').join('\\n'):m);\n  const L=[];let st=[],cur=-1;const P=o=>{L.push(o);if(mp)mp.push(cur)};\n  for(let line of src.split('\\n')){cur++;\n    line=line.replace(/\\s+$/,'');let m;\n    if((m=/^\\s{0,3}(#{1,6})[ \\t]+(.+)$/ block}\n#name .sh::after{content:\"\";position:absolute;left:-1px;right:-1px;bottom:-4px;height:3px;border-radius:2px;background:var(--red)}\n#name .mb{font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);opacity:.8;margin-left:-2px;align-self:flex-end;padding-bottom:1px}\n#guide h3{margin:0;font-size:18px}\n#guide .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}\n#guide .lead{margin:0 0 6px;color:#5c574f}\n#guide h4{display:flex;align-items:center;gap:9px;margin:20px 0 4px;font-size:15px}\n#guide h4 i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#fff;font-size:12px;font-weight:600;line-height:1;font-style:normal}\n#guide h4.plain{margin-top:22px}\n#guide p{margin:0 0 4px}\n#guide ul{margin:2px 0 4px;padding-left:1.3em}\n#guide li{margin:1px 0}\n#guide code{background:#f4f0e8;padding:1px 7px;border-radius:5px;font:13px ui-monospace,Consolas,monospace}\n#guide .o{color:var(--org);font-weight:600}\n#guide .r{color:var(--red);font-weight:700}\n#guide{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}\n#guide[hidden]{display:none}\n#guide .gp{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 20px calc(26px + env(safe-area-inset-bottom));font-size:15px;line-height:1.85}\n#gClose{border:1px solid var(--line);padding:6px 14px}\n#guide .gv{font-size:12px;font-weight:500;color:var(--sub);margin-left:6px}\n#bot button.sm{display:flex;align-items:center;justify-content:center}\n#fi{padding:0 18px 14px;margin-bottom:12px;border-bottom:1px solid var(--line)}\n#fname{font-size:14px;font-weight:600;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#fcnt{display:flex;gap:14px;margin-top:2px;font-size:12px}\n#fcnt .c1{color:var(--org)}\n#fcnt .c2{color:var(--red);font-weight:700}\n#panel .r2 button.on{background:var(--fg);color:#fff;border-color:var(--fg)}\n\n/* ---- Markdown 表示 ---- */\n.b{font-weight:700}.i{font-style:italic}.s{text-decoration:line-through}.u{text-decoration:underline}.s.u{text-decoration:line-through underline}\n.su,.sb{font-size:.72em;line-height:0}.su{vertical-align:super}.sb{vertical-align:sub}\n.lk:not(.m),.url:not(.m){color:#1a5fb4;text-decoration:underline;text-underline-offset:2px}\n.lk.m,.url.m{text-decoration:underline;text-underline-offset:2px}\n.ln[data-t^=\"h\"]:not([data-t=\"hr\"]){min-height:0;white-space:normal;font-weight:700;line-height:1.5;scroll-margin-top:76px;margin:1.1em 0 .3em}\n.ln[data-t^=\"h\"]:not([data-t=\"hr\"]):first-child{margin-top:0}\n.ln[data-t=\"h1\"]{font-size:1.55em;padding-bottom:.25em;border-bottom:2px solid var(--fg)}\n.ln[data-t=\"h2\"]{font-size:1.3em;padding-bottom:.2em;border-bottom:1px solid var(--line)}\n.ln[data-t=\"h3\"]{font-size:1.12em}\n.ln[data-t=\"h4\"]{font-size:1em;color:var(--sub)}\n.ln[data-t=\"h5\"]{font-size:.95em;color:var(--sub)}\n.ln[data-t=\"h6\"]{font-size:.9em;color:var(--sub)}\n.ln[data-t=\"ul\"],.ln[data-t=\"ol\"]{position:relative;padding-left:calc(1.8em + var(--d,0)*1.8em)}\n.ln[data-d=\"1\"]{--d:1}.ln[data-d=\"2\"]{--d:2}.ln[data-d=\"3\"]{--d:3}.ln[data-d=\"4\"]{--d:4}\n.ln[data-t=\"ul\"]::before,.ln[data-t=\"ol\"]::before{position:absolute;left:calc(var(--d,0)*1.8em);width:1.4em;text-align:right;color:var(--sub)}\n.ln[data-t=\"ul\"]::before{content:\"•\"}\n.ln[data-t=\"ul\"][data-d=\"1\"]::before,.ln[data-t=\"ul\"][data-d=\"4\"]::before{content:\"◦\"}\n.ln[data-t=\"ul\"][data-d=\"2\"]::before{content:\"▪\"}\n.ln[data-t=\"ol\"]::before{content:attr(data-n) \".\"}\n.ln[data-t=\"q\"]{border-left:3px solid #d8d2c6;padding-left:14px;color:#5c574f}\n.ln[data-t=\"hr\"]{min-height:0;height:0;margin:1.1em 0;border-top:2px solid var(--line)}\n.view .cm,.view .ln[data-co]{display:none}\n.edit .cm{color:#8a847c;background:#f4f0e8;border-radius:4px;padding:0 5px;font-style:italic;font-size:.9em}\n.edit .cm::before{content:\"// \";opacity:.7}\n/* ---- .txt → .md 変換ダイアログ ---- */\n#conv{position:fixed;inset:0;z-index:50;background:rgba(30,20,10,.4);display:flex;align-items:center;justify-content:center}\n#conv[hidden]{display:none}\n#conv .card{background:var(--card);border-radius:14px;padding:22px 26px;width:min(500px,92vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.22);font-size:14px;line-height:1.8}\n#conv h3{margin:0 0 8px;font-size:17px}#conv p{margin:0 0 6px}#conv ul{margin:4px 0 8px;padding-left:1.3em}\n#conv code{background:#f4f0e8;padding:1px 6px;border-radius:5px;font:13px ui-monospace,Consolas,monospace}\n#conv .cvn{color:var(--sub);font-size:13px}#conv .cvw{color:var(--red);font-size:13px}\n#conv .cb{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}\n.pcs{display:flex;gap:10px;margin:10px 0 12px}\n.pcs label{flex:1;display:flex;flex-direction:column;gap:6px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;position:relative}\n.pcs label:has(input:checked){border-color:var(--fg);background:#f4f0e8}\n.pcs input{position:absolute;opacity:0;pointer-events:none}\n.pcs .t{font-weight:600}.pcs .ex{font-size:13px;line-height:1.7}\n#conv .cb button{border:1px solid var(--line);padding:9px 16px}\n#conv .cb button.solid{background:var(--fg);color:#fff;border-color:var(--fg)}\n\n#name{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:6px;row-gap:6px;padding-bottom:0}\n#name .wm{grid-column:1/-1}\n#name .mb{margin:0;line-height:1}\n#name .ver{margin:0;align-self:center;padding:0;line-height:1;font-size:10.5px}\n@media (max-width:380px){#top{gap:3px;padding-left:6px;padding-right:6px}#top button{padding:8px 8px}#top .grp button{padding:8px 9px}#name .wm{font-size:15px}#name .mb{font-size:9px;letter-spacing:.1em}}\n@media (max-width:340px){#name .wm{font-size:13.5px}#top button{padding:8px 6px}#top .grp button{padding:8px 7px}}\n.ln[data-t^=\"h\"]:not([data-t=\"hr\"]){scroll-margin-top:calc(68px + env(safe-area-inset-top))}\n#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 18px;background:var(--fg);color:#fff;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw}\n#toast.show{opacity:1}\n@media print{\n@page{margin:14mm}\nhtml,body{background:#fff!important}\n*{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none!important}\n#top,#bot,#drawer,#menu,#guide,#conv,#toast,#hint,#empty{display:none!important}\n#sheet{margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:#fff;min-height:0}\n.cm,.ln[data-co]{display:none!important}\n.ln{break-inside:avoid}\n.ln[data-t^=\"h\"]:not([data-t=\"hr\"]){break-after:avoid}\na,.lk,.url{color:inherit!important}\n\n.m1,.edit .m1,#ed .m1{color:#000;border-bottom:2px dashed #000;padding-bottom:1px}\n.m2,.edit .m2,#ed .m2{color:#000;font-weight:700;border-bottom:3px solid #000;padding-bottom:1px}\nbody.pc-color .m1,body.pc-color #ed .m1{color:var(--org);border-bottom:2px solid var(--org)}\nbody.pc-color .m2,body.pc-color #ed .m2{color:var(--red);font-weight:700;border-bottom:3px solid var(--red)}\n.view.stage-all:not(.peek) .m1:not(.r),.view.stage-all:not(.peek) .m2:not(.r),.view.stage-imp:not(.peek) .m2:not(.r){background:none!important;color:transparent!important;box-shadow:none}\n}\n<\/style>\n<\/head>\n<body class=\"view stage-all\">\n<div id=\"top\">\n  <button id=\"bToc\" aria-label=\"目次\"><i><\/i><i><\/i><i><\/i><\/button>\n  <div id=\"title\"><div id=\"name\"><span class=\"wm\"><b>Anki<\/b> <span class=\"sh\">Sheet<\/span><\/span><span class=\"mb\">Mobile<\/span><span class=\"ver\">v3.5<\/span><\/div><\/div>\n  <span class=\"grp\"><button id=\"mV\" class=\"on\">閲覧<\/button><button id=\"mE\">編集<\/button><\/span>\n  <button id=\"bMenu\">メニュー<\/button>\n<\/div>\n<div id=\"sheet\"><div id=\"empty\">「メニュー」から .md を開く<\/div><\/div>\n<div id=\"hint\"><span id=\"hintV\">タップで表示／再タップで隠す<\/span><span id=\"hintE\">長押ししてなぞると範囲選択／色付きの語はタップで選択 → 下のボタンで変更<\/span><\/div>\n<div id=\"bot\">\n  <div class=\"g\" id=\"gv\">\n    <button id=\"bAll\" class=\"on\">すべて<\/button><button id=\"bImp\">重要語のみ<\/button><button id=\"bPeek\">全表示<\/button><button id=\"bRe\">隠し直し<\/button>\n  <\/div>\n  <div class=\"g\" id=\"ge\">\n    <button id=\"b1\" class=\"t1\">通常<\/button><button id=\"b2\" class=\"t2\">重要<\/button><button id=\"b0\">解除<\/button>\n    <button id=\"bUn\" class=\"sm\" aria-label=\"元に戻す\" title=\"元に戻す\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/><\/svg><\/button><button id=\"bRd\" class=\"sm\" aria-label=\"やり直す\" title=\"やり直す\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 14 5-5-5-5\"/><path d=\"M20 9H10a6 6 0 0 0 0 12h3\"/><\/svg><\/button>\n  <\/div>\n<\/div>\n<div id=\"drawer\"><div id=\"dp\"><div id=\"fi\"><div id=\"fname\"><\/div><div id=\"fcnt\"><\/div><\/div><div class=\"tt\">目次<\/div><div id=\"tocList\"><\/div><\/div><\/div>\n<div id=\"guide\" hidden><div class=\"gp\">\n  <div class=\"gh\"><h3>Anki Sheet の使い方 <small class=\"gv\">v3.5<\/small><\/h3><button id=\"gClose\">閉じる<\/button><\/div>\n  <p class=\"lead\">Markdown（.md）ファイルから、赤シート式の暗記シートを作るツールです。覚えたい語に印を付けて隠し、思い出す練習ができます。内容は外部に送信されず、前回開いたファイルは次回自動で開きます。<\/p>\n  <p class=\"lead\"><b>v3.0 から、ファイル形式が .txt から .md（Markdown）に変更になりました。<\/b><\/p>\n\n  <h4><i>1<\/i>ファイルを開く<\/h4>\n  <p>「メニュー → ファイルを開く」で .md を選びます。テキストをコピーしてある場合は「貼り付けて読み込む」でも入れられます。従来の .txt を選ぶと、.md への変換ダイアログが出ます（元の .txt は変更されません）。<\/p>\n\n  <h4><i>2<\/i>隠して覚える（閲覧モード）<\/h4>\n  <p>上の「閲覧」を選ぶと、印を付けた語が赤いシートで隠れます。<\/p>\n  <ul>\n    <li>「すべて」は通常語も重要語も隠し、「重要語のみ」は重要語だけ隠します<\/li>\n    <li>語をタップで表示、もう一度タップで隠します<\/li>\n    <li>「全表示」「隠し直し」で、まとめて切り替えられます<\/li>\n    <li>リンクはタップで開きます（隠れている語は、先に表示されます）<\/li>\n  <\/ul>\n\n  <h4><i>3<\/i>覚える語に印を付ける（編集モード）<\/h4>\n  <p>上の「編集」を選び、語を長押しして、そのまま指をなぞると範囲が選べます。下の <span class=\"o\">通常<\/span>（オレンジ）・<span class=\"r\">重要<\/span>（赤・太字）・解除のボタンで変更します。<\/p>\n  <ul>\n    <li>色の付いた語をタップすると、その語の範囲が選ばれます<\/li>\n    <li>間違えたら「戻す」「進む」で操作を取り消せます<\/li>\n  <\/ul>\n\n  <h4><i>4<\/i>見出しと目次<\/h4>\n  <p>行頭に <code># <\/code>〜<code>###### <\/code> を付けると見出しになります。左上の ≡ ボタンで目次が開き、▾ で枝を折りたため、項目をタップするとその見出しへ移動します。<\/p>\n  <p>スマホ版では、印以外（文章・見出し・書式）は編集できません。PC版の「編集」モードか、.md を直接編集してください。<\/p>\n\n  <h4><i>5<\/i>保存とPCとの共有<\/h4>\n  <p>編集内容は端末内に自動で記録されます。「メニュー → 共有・書き出し」で .md として保存でき、PC版（Anki Sheet）で開けます。PCの .md を iCloud や Google Drive に置けば、スマホからも開けます。<\/p>\n\n  <h4 class=\"plain\">.md の書き方<\/h4>\n  <ul>\n    <li>印：<code>==通常==<\/code>　<code>===重要===<\/code><\/li>\n    <li>見出し <code># 見出し<\/code>　太字 <code>**太字**<\/code>　斜体 <code>*斜体*<\/code>　取り消し線 <code>~~取消~~<\/code>　下線 <code>__下線__<\/code><\/li>\n    <li>箇条書き <code>- 項目<\/code>　番号付き <code>1. 項目<\/code>　引用 <code>&gt; 引用<\/code>　水平線 <code>---<\/code><\/li>\n    <li>リンク <code>[表示](https://…)<\/code>　ページ内リンク <code>[表示](#見出し名)<\/code>　URL はそのままでもリンクになります<\/li>\n    <li>記号をそのまま出す：<code>\\*<\/code> のように前に <code>\\<\/code> を付けます<\/li>\n    <li>コメント：<code>&lt;!-- メモ --&gt;<\/code>（閲覧モードでは非表示）<\/li>\n  <\/ul>\n  <h4 class=\"plain\">表示モード<\/h4>\n  <p>端末に合わせて、PC向けとスマホ向けの表示が自動で切り替わります。「メニュー → 表示」で、自動・PC・スマホを選べます。<\/p>\n<\/div><\/div>\n<div id=\"menu\"><div id=\"panel\">\n  <button id=\"mOpen\">ファイルを開く<\/button>\n  <button id=\"mPasteBtn\">貼り付けて読み込む<\/button>\n  <textarea id=\"paste\" placeholder=\"ここに貼り付け\"><\/textarea>\n  <button id=\"mPasteGo\" style=\"display:none\">読み込む<\/button>\n  <button id=\"mShare\">共有・書き出し (.md)<\/button>\n  <button id=\"mCopy\">テキストをコピー<\/button>\n  <button id=\"mPrint\">印刷<\/button>\n  <button id=\"mGuide\">ヘルプ（使い方）<\/button>\n  <div class=\"r2\"><span>表示<\/span><span><button data-view=\"auto\">自動<\/button><button data-view=\"pc\">PC<\/button><button data-view=\"mobile\">スマホ<\/button><\/span><\/div>\n  \n  <div class=\"r2\"><span>文字サイズ<\/span><span><button id=\"fm\">小<\/button><button id=\"fp\">大<\/button><\/span><\/div>\n  <button id=\"mClose\" style=\"text-align:center;color:var(--sub);border:0\">閉じる<\/button>\n  <div id=\"note\">PCで作った .md を iCloud・Google Drive などに置き、ここで開くと同期できます。従来の .txt を開くと、.md への変換ダイアログが出ます。編集後は「共有・書き出し」で戻せます。<\/div>\n<\/div><\/div>\n<input type=\"file\" id=\"file\" accept=\".md,.markdown,.txt,text/markdown,text/plain,text/*\" hidden>\n<div id=\"conv\" hidden><div class=\"card\"><h3 id=\"cvT\"><\/h3><div id=\"cvB\"><\/div><div class=\"cb\" id=\"cvBtns\"><\/div><\/div><\/div>\n<div id=\"toast\"><\/div>\n<script>\n/* ===== core: 文書モデル / Markdown の読み書き ===== */\n/* 文書 = 行の配列。行 = {t:種類, d:字下げ, r:[run]}、run = {t:文字, f:装飾ビット, m:印(0/1/2), h:リンク先} */\nconst FB=1,FI=2,FS=4,FU=8,FP=16,FQ=32,FC=64;\nconst FLAGS=[['b',FB],['i',FI],['s',FS],['u',FU],['su',FP],['sb',FQ],['cm',FC]];\nconst BTYPE=/^(p|h[1-6]|ul|ol|q|hr)$/,HRE=/^h[1-6]$/,MAXD=4;\nconst HSEL=[1,2,3,4,5,6].map(n=>`.ln[data-t=\"h${n}\"]`).join(',');\nconst isHead=t=>HRE.test(t),isList=t=>t==='ul'||t==='ol';\nconst lineText=l=>l.r.map(r=>r.t).join('');\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst newLine=(t='p')=>({t,d:0,r:[]});\n\nfunction mergeRuns(rs){const o=[];for(const r of rs){if(!r.t)continue;const p=o[o.length-1];if(p&&p.f===r.f&&p.m===r.m&&p.h===r.h)p.t+=r.t;else o.push({t:r.t,f:r.f,m:r.m,h:r.h})}return o}\n\n/* 太字・印などの範囲の端にある空白は、記号の外へ出す（Markdown で正しく読まれるため） */\nfunction trimFlank(rs){\n  const cs=[];for(const r of rs)for(const c of r.t)cs.push({c,f:r.f,m:r.m,h:r.h});\n  const ws=c=>/\\s/.test(c);\n  const pass=(get,clr)=>{let i=0;while(i<cs.length){const v=get(cs[i]);if(!v){i++;continue}let j=i;while(j<cs.length&&get(cs[j])===v)j++;\n    let a=i,b=j;while(a<b&&ws(cs[a].c))a++;while(b>a&&ws(cs[b-1].c))b--;\n    for(let k=i;k<a;k++)clr(cs[k]);for(let k=b;k<j;k++)clr(cs[k]);i=j}};\n  for(const bit of [FB,FI,FS,FU])pass(x=>x.f&FC?0:(x.f&bit),x=>{x.f&=~bit});\n  pass(x=>x.m,x=>{x.m=0});\n  return mergeRuns(cs.map(x=>({t:x.c,f:x.f,m:x.m,h:x.h})));\n}\n\n/* ---------- URL / リンク ---------- */\nconst urlEnd=u=>u.replace(/[.,;:!?)'\"。、）」』】]+$/,'');\nfunction splitUrl(t){\n  const out=[],re=/https?:\\/\\/[^\\s<>\\[\\]]+/g;let last=0,m;\n  while((m=re.exec(t))){const u=urlEnd(m[0]);if(u.length<9)continue;\n    if(m.index>last)out.push([t.slice(last,m.index),0]);out.push([u,1]);last=m.index+u.length;re.lastIndex=last}\n  if(last<t.length)out.push([t.slice(last),0]);\n  return out.length?out:[[t,0]];\n}\nconst safeHref=h=>{h=(h||'').trim();return /^(https?:\\/\\/|mailto:|#)/i.test(h)?h:''};\nconst slugify=s=>s.trim().toLowerCase().replace(/[^\\p{L}\\p{N}\\p{M}\\s_-]/gu,'').replace(/\\s+/g,'-');\nfunction slugMap(L){ // 見出しのスラッグ → 行番号（重複は -1, -2 …）\n  const mp={},cnt={};L.forEach((l,i)=>{if(!isHead(l.t))return;let sg=slugify(lineText(l))||'h';const k=cnt[sg]=(cnt[sg]??-1)+1;if(k)sg+='-'+k;mp[sg]=i});return mp;\n}\n\n/* ---------- インライン解析 ---------- */\nconst ESCP='\\\\`*_{}[]()#+-.!~=<>|/:;\"\\'&%$@^,?';\nconst LINKRE=/^\\[((?:\\\\.|[^\\]\\\\\\n])+)\\]\\(([^)\\s]+)\\)/;\nconst DBIT={'**':FB,'*':FI,'~~':FS,'__':FU,sup:FP,sub:FQ},LIT={sup:'<sup>',sub:'<sub>'};\nconst parseInline=s=>mergeRuns(inl(s));\nfunction inl(s){\n  const toks=[],stack=[];let buf='',i=0;\n  const flush=()=>{if(buf){toks.push({k:'t',v:buf});buf=''}};\n  const sp=c=>c===undefined||/\\s/.test(c);\n  const open=d=>{flush();const tk={k:'d',d,on:false,cl:false};toks.push(tk);stack.push({d,tk})};\n  const close=d=>{for(let j=stack.length-1;j>=0;j--)if(stack[j].d===d){stack[j].tk.on=true;stack.length=j;flush();toks.push({k:'d',d,on:true,cl:true});return true}return false};\n  while(i<s.length){\n    const c=s[i];\n    if(c==='\\\\'&&i+1<s.length&&ESCP.includes(s[i+1])){buf+=s[i+1];i+=2;continue}\n    if(c==='<'){\n      if(s.startsWith('<\!--',i)){const e=s.indexOf('-->',i+4);if(e>0){flush();toks.push({k:'c',v:s.slice(i+4,e).replace(/^ | $/g,'')});i=e+3;continue}}\n      const m=/^<(\\/?)(sup|sub)>/i.exec(s.slice(i,i+7));\n      if(m){const d=m[2].toLowerCase();if(!m[1])open(d);else if(!close(d))buf+=m[0];i+=m[0].length;continue}\n    }\n    if(c==='['){const m=LINKRE.exec(s.slice(i));if(m){flush();toks.push({k:'l',label:m[1],href:m[2]});i+=m[0].length;continue}}\n    if(c==='h'&&(s.startsWith('http://',i)||s.startsWith('https://',i))){\n      const m=/^https?:\\/\\/[^\\s<>\\[\\]]+/.exec(s.slice(i));\n      if(m){const u=urlEnd(m[0]);if(u.length>=9){buf+=u;i+=u.length;continue}}\n    }\n    if(c==='*'||c==='_'||c==='~'||c==='='){\n      let L=1;while(s[i+L]===c)L++;\n      const prevSp=sp(s[i-1]),nextSp=sp(s[i+L]);\n      if(c==='*'){\n        let rest=L;\n        while(rest>0&&!prevSp){const top=stack[stack.length-1];\n          if(top&&(top.d==='**'||top.d==='*')&&rest>=top.d.length){flush();top.tk.on=true;stack.pop();toks.push({k:'d',d:top.d,on:true,cl:true});rest-=top.d.length}else break}\n        if(rest>0){if(rest<=3&&!nextSp){while(rest>=2){open('**');rest-=2}if(rest===1)open('*')}else buf+='*'.repeat(rest)}\n      }else{\n        const d=c==='='?(L===2?'==':L===3?'===':null):(L===2?c+c:null);\n        if(!d)buf+=c.repeat(L);\n        else if(!prevSp&&close(d)){}\n        else if(!nextSp)open(d);\n        else buf+=c.repeat(L);\n      }\n      i+=L;continue;\n    }\n    buf+=c;i++;\n  }\n  flush();\n  const runs=[],act={};\n  const curF=()=>{let f=0;for(const k in DBIT)if(act[k]>0)f|=DBIT[k];return f};\n  const curM=()=>act['===']>0?2:act['==']>0?1:0;\n  for(const tk of toks){\n    if(tk.k==='t')runs.push({t:tk.v,f:curF(),m:curM(),h:''});\n    else if(tk.k==='c')runs.push({t:tk.v,f:FC,m:0,h:''});\n    else if(tk.k==='l'){\n      const href=safeHref(tk.href.replace(/%20/g,' ').replace(/%29/g,')'));\n      for(const r of inl(tk.label))runs.push({t:r.t,f:(r.f&FC)?FC:(r.f|curF()),m:(r.f&FC)?0:(r.m||curM()),h:(r.f&FC)?'':href});\n    }else{\n      if(!tk.on){runs.push({t:LIT[tk.d]||tk.d,f:curF(),m:curM(),h:''});continue}\n      act[tk.d]=(act[tk.d]||0)+(tk.cl?-1:1);\n    }\n  }\n  return runs;\n}\n\n/* ---------- ブロック解析（.md） ---------- */\nfunction parseMd(src){\n  src=src.replace(/^\\uFEFF/,'').replace(/\\r\\n?/g,'\\n').replace(/<\!--([\\s\\S]*?)-->/g,(m,c)=>c.includes('\\n')?c.split('\\n').map(x=>'<\!--'+x+'-->').join('\\n'):m);\n  const L=[];let st=[];\n  for(let line of src.split('\\n')){\n    line=line.replace(/\\s+$/,'');let m;\n    if((m=/^\\s{0,3}(#{1,6})[ \\t]+(.+)$/.exec(line))){L.push({t:'h'+m[1].length,d:0,r:parseInline(m[2].trim())});st=[];continue}\n    if(/^\\s{0,3}([-*_])(?:\\s*\\1){2,}$/.test(line)){L.push({t:'hr',d:0,r:[]});st=[];continue}\n    if((m=/^\\s{0,3}>[ \\t]?(.*)$/.exec(line))){L.push({t:'q',d:0,r:parseInline(m[1])});st=[];continue}\n    let kind=null;\n    if((m=/^([ \\t]*)[-+*](?:[ \\t]+(.*))?$/.exec(line)))kind='ul';\n    else if((m=/^([ \\t]*)\\d{1,9}[.)](?:[ \\t]+(.*))?$/.exec(line)))kind='ol';\n    if(kind){\n      const w=m[1].replace(/\\t/g,'    ').length;\n      while(st.length&&st[st.length-1]>w)st.pop();\n      if(!st.length||st[st.length-1]<w)st.push(w);\n      L.push({t:kind,d:Math.min(MAXD,st.length-1),r:parseInline(m[2]||'')});continue;\n    }\n    st=[];L.push({t:'p',d:0,r:parseInline(line)});\n  }\n  for(let i=L.length-2;i>=0;i--)if(L[i].t==='p'&&!L[i].r.length&&isHead(L[i+1].t))L.splice(i,1); // 見出しの前の空行は無視\n  if(!L.length)L.push(newLine());\n  return L;\n}\n\n/* ---------- 旧 .txt 形式（== 見出し ==、**通常**、***重要***） ---------- */\nfunction parseLegacy(src){\n  src=src.replace(/^\\uFEFF/,'').replace(/\\r\\n?/g,'\\n');\n  const HR=/^\\s*(={1,6})\\s*(.+?)\\s*\\1\\s*$/,heads={},raw=src.split('\\n'),keep=[];let bh=false;\n  for(let i=raw.length-1;i>=0;i--){const l=raw[i];if(HR.test(l)){bh=true;keep.push(l)}else if(!l.trim()){if(!bh)keep.push(l)}else{bh=false;keep.push(l)}}\n  keep.reverse();\n  src=keep.map((ln,i)=>{const h=ln.match(HR);if(h){heads[i]=h[1].length;return h[2]}return ln}).join('\\n');\n  const re=/\\*\\*\\*([^\\n]+?)\\*\\*\\*|\\*\\*([^\\n]+?)\\*\\*/g;let text='',last=0,m,marks=[];\n  while((m=re.exec(src))){text+=src.slice(last,m.index);const w=m[1]??m[2];marks.push({s:text.length,e:text.length+w.length,l:m[1]!=null?2:1});text+=w;last=re.lastIndex}\n  text+=src.slice(last);\n  const L=[];let pos=0,mi=0;\n  text.split('\\n').forEach((tx,i)=>{\n    const ls=pos,le=pos+tx.length,r=[];let c=ls;\n    while(mi<marks.length&&marks[mi].s<le){const k=marks[mi++];if(k.s>c)r.push({t:text.slice(c,k.s),f:0,m:0,h:''});r.push({t:text.slice(k.s,Math.min(k.e,le)),f:0,m:k.l,h:''});c=k.e}\n    if(c<le)r.push({t:text.slice(c,le),f:0,m:0,h:''});\n    L.push({t:heads[i]?'h'+Math.min(6,heads[i]):'p',d:0,r:mergeRuns(r)});pos=le+1;\n  });\n  return L;\n}\n\n/* ---------- 書き出し ---------- */\nfunction numberLines(L){\n  const ns=[];let cnt=[];\n  L.forEach((l,i)=>{\n    if(l.t==='ol'){const d=l.d||0;cnt.length=d+1;cnt[d]=(cnt[d]||0)+1;ns[i]=cnt[d]}\n    else{if(l.t==='ul')cnt.length=Math.min(cnt.length,l.d||0);else cnt=[];ns[i]=0}\n  });\n  return ns;\n}\nconst OPENS={m1:'==',m2:'===',b:'**',i:'*',s:'~~',u:'__',su:'<sup>',sb:'<sub>'};\nconst CLOSES={m1:'==',m2:'===',b:'**',i:'*',s:'~~',u:'__',su:'<\/sup>',sb:'<\/sub>'};\nfunction escRun(t,hasPrev,hasNext){\n  let o='';\n  for(let i=0;i<t.length;i++){\n    const c=t[i];\n    if(c==='\\\\'||c==='*'||c==='['||c===']'||c==='<'||c==='`')o+='\\\\'+c;\n    else if(c==='_'||c==='~'||c==='='){\n      const edge=(i===0&&hasPrev)||(i===t.length-1&&hasNext);\n      o+=(t[i-1]===c||t[i+1]===c||edge)?'\\\\'+c:c;\n    }else o+=c;\n  }\n  return o;\n}\nfunction escPlain(t,hasPrev,hasNext){ // URL はそのまま、他は記号を逃がす\n  return splitUrl(t).map(([s,u],k,a)=>u?s:escRun(s,hasPrev||k>0,hasNext||k<a.length-1)).join('');\n}\nconst encHref=h=>h.replace(/\\s/g,'%20').replace(/\\)/g,'%29');\nfunction serInline(rs){\n  let out='';const stk=[];\n  const closeTo=n=>{while(stk.length>n){const k=stk.pop();out+=k.startsWith('h:')?']('+encHref(k.slice(2))+')':CLOSES[k]}};\n  rs.forEach((r,idx)=>{\n    if(!r.t)return;\n    if(r.f&FC){closeTo(0);out+='<\!-- '+r.t.replace(/-->/g,'-- >')+' -->';return}\n    const need=[];\n    if(r.h)need.push('h:'+r.h);\n    if(r.m===2)need.push('m2');else if(r.m===1)need.push('m1');\n    if(r.f&FB)need.push('b');if(r.f&FI)need.push('i');if(r.f&FS)need.push('s');if(r.f&FU)need.push('u');if(r.f&FP)need.push('su');if(r.f&FQ)need.push('sb');\n    let k=0;while(k<stk.length&&k<need.length&&stk[k]===need[k])k++;\n    closeTo(k);\n    for(let j=k;j<need.length;j++){stk.push(need[j]);out+=need[j].startsWith('h:')?'[':OPENS[need[j]]}\n    const hp=idx>0&&!(rs[idx-1].f&FC),hn=idx<rs.length-1&&!(rs[idx+1].f&FC);\n    out+=r.h?escRun(r.t,false,false):escPlain(r.t,hp,hn);\n  });\n  closeTo(0);return out;\n}\nfunction escLead(s){ // 行頭が Markdown の記号に見える文章は、先頭を \\ で逃がす\n  let m;\n  if((m=/^(\\s{0,3})(#{1,6})(?=\\s|$)/.exec(s)))return s.slice(0,m[1].length)+'\\\\'+s.slice(m[1].length);\n  if((m=/^(\\s{0,3})([-+])(?=\\s|$)/.exec(s)))return s.slice(0,m[1].length)+'\\\\'+s.slice(m[1].length);\n  if((m=/^(\\s{0,3})>/.exec(s)))return s.slice(0,m[1].length)+'\\\\'+s.slice(m[1].length);\n  if((m=/^(\\s{0,3})(\\d{1,9})([.)])(?=\\s|$)/.exec(s)))return s.slice(0,m[1].length+m[2].length)+'\\\\'+s.slice(m[1].length+m[2].length);\n  if((m=/^(\\s{0,3})([-_])(?:\\s*\\2){2,}$/.exec(s)))return s.slice(0,m[1].length)+'\\\\'+s.slice(m[1].length);\n  return s;\n}\nfunction serializeLines(L){\n  const out=[],ns=numberLines(L);\n  L.forEach((l,i)=>{\n    const r=trimFlank(l.r),s=serInline(r),ind='    '.repeat(isList(l.t)?(l.d||0):0);\n    if(isHead(l.t)&&out.length&&out[out.length-1]!=='')out.push('');\n    if(isHead(l.t))out.push('#'.repeat(+l.t[1])+' '+s);\n    else if(l.t==='hr')out.push('---');\n    else if(l.t==='ul')out.push(s?ind+'- '+s:ind+'-');\n    else if(l.t==='ol')out.push(s?ind+ns[i]+'. '+s:ind+ns[i]+'.');\n    else if(l.t==='q')out.push(s?'> '+s:'>');\n    else out.push(escLead(s));\n  });\n  return out.join('\\n');\n}\nconst convertLegacy=src=>serializeLines(parseLegacy(src));\n\n/* ---------- 範囲の編集（文字位置は、全行の本文を \\n でつないだ位置） ---------- */\nfunction lineOffsets(L){const a=[];let p=0;for(const l of L){a.push(p);p+=lineText(l).length+1}return a}\nfunction mapLine(l,x,y,fn){\n  const out=[];let p=0;\n  for(const r of l.r){\n    const e=p+r.t.length;\n    if(e<=x||p>=y)out.push(r);\n    else{const u=Math.max(x,p)-p,v=Math.min(y,e)-p;\n      if(u>0)out.push({...r,t:r.t.slice(0,u)});\n      const mid={...r,t:r.t.slice(u,v)};out.push(fn(mid)||mid);\n      if(v<r.t.length)out.push({...r,t:r.t.slice(v)})}\n    p=e;\n  }\n  const mg=mergeRuns(out);\n  if(JSON.stringify(mg)===JSON.stringify(l.r))return false;\n  l.r=mg;return true;\n}\nfunction mapRange(L,a,b,fn,trim){\n  const offs=lineOffsets(L);let ch=false;\n  L.forEach((l,i)=>{\n    const s=offs[i],txt=lineText(l);let x=Math.max(a,s)-s,y=Math.min(b,s+txt.length)-s;\n    if(y<=x)return;\n    if(trim){while(x<y&&/\\s/.test(txt[x]))x++;while(y>x&&/\\s/.test(txt[y-1]))y--;if(y<=x)return}\n    if(mapLine(l,x,y,fn))ch=true;\n  });\n  return ch;\n}\nfunction rangeScan(L,a,b,pred){ // 範囲内の文字（空白のみは除く）が、すべて/ひとつでも pred を満たすか\n  const offs=lineOffsets(L);let any=false,all=true,some=false;\n  L.forEach((l,i)=>{let p=offs[i];for(const r of l.r){const e=p+r.t.length;\n    if(e>a&&p<b&&!/^\\s*$/.test(r.t.slice(Math.max(a,p)-p,Math.min(b,e)-p))){any=true;if(pred(r))some=true;else all=false}p=e}});\n  return{any,all:any&&all,some};\n}\nfunction applyMark(L,a,b,lvl){\n  const offs=lineOffsets(L);let ch=false;\n  L.forEach((l,i)=>{\n    const s=offs[i],txt=lineText(l),len=txt.length;let x=Math.max(a,s)-s,y=Math.min(b,s+len)-s;\n    const P=[];let p=0;for(const r of l.r){P.push([p,p+r.t.length,r.m]);p+=r.t.length}\n    const G=[];for(const q of P){if(!q[2])continue;const g=G[G.length-1];if(g&&g[1]===q[0]&&g[2]===q[2])g[1]=q[1];else G.push([q[0],q[1],q[2]])}\n    if(a===b){if(a<s||a>s+len)return;const g=G.find(g=>g[0]<=x&&x<g[1])||G.find(g=>g[0]<=x&&x<=g[1]);if(!g)return;x=g[0];y=g[1]}\n    else{if(y<=x)return;while(x<y&&/\\s/.test(txt[x]))x++;while(y>x&&/\\s/.test(txt[y-1]))y--;if(y<=x)return}\n    const ov=G.filter(g=>g[0]<y&&g[1]>x);\n    if(!ov.length&&!lvl)return;\n    for(const g of ov){x=Math.min(x,g[0]);y=Math.max(y,g[1])}\n    if(mapLine(l,x,y,r=>{if(r.f&FC)return r;r.m=lvl;return r}))ch=true;\n  });\n  return ch;\n}\nfunction insertRun(L,off,run){ // 位置 off に run を差し込む\n  const offs=lineOffsets(L);\n  for(let i=0;i<L.length;i++){\n    const s=offs[i],len=lineText(L[i]).length;\n    if(off<=s+len){const x=off-s,out=[];let p=0,done=false;\n      for(const r of L[i].r){const e=p+r.t.length;\n        if(!done&&x>=p&&x<=e){if(x>p)out.push({...r,t:r.t.slice(0,x-p)});out.push(run);if(x<e)out.push({...r,t:r.t.slice(x-p)});done=true}else out.push(r);p=e}\n      if(!done)out.push(run);\n      L[i].r=mergeRuns(out);return true}\n  }\n  return false;\n}\nconst markCount=L=>{let n1=0,n2=0;for(const l of L){let pm=0;for(const r of l.r){if(r.m&&r.m!==pm){r.m===1?n1++:n2++}pm=r.m}}return[n1,n2]};\n\n/* ---------- 表示用 HTML ---------- */\nfunction linesHTML(L,edit){\n  const offs=lineOffsets(L),ns=numberLines(L),slugs={},sm=edit?null:slugMap(L);\n  if(sm)for(const k in sm)slugs[sm[k]]=k;\n  let h='',G=0;\n  L.forEach((l,i)=>{\n    const t=l.t;\n    if(t==='hr'){h+=`<div class=\"ln\" data-t=\"hr\"${edit?' contenteditable=\"false\"':` data-l=\"${offs[i]}\" data-i=\"${i}\"`}><\/div>`;return}\n    let a=`class=\"ln\" data-t=\"${t}\"`;\n    if(isList(t)&&l.d)a+=` data-d=\"${l.d}\"`;\n    if(t==='ol')a+=` data-n=\"${ns[i]}\"`;\n    if(!edit){a+=` data-l=\"${offs[i]}\" data-i=\"${i}\"`;if(slugs[i])a+=` data-slug=\"${esc(slugs[i])}\"`;if(l.r.length&&l.r.every(r=>r.f&FC))a+=' data-co=\"1\"'}\n    let inner='',o=offs[i],lastM=0,gid=0;\n    for(const r of l.r){\n      let g='';\n      if(r.m){let head='';if(r.m!==lastM){G++;gid=G;head=' data-gh=\"1\"'}g=` data-g=\"${gid}\"${head}`}\n      lastM=r.m;\n      const segs=(r.h||(r.f&FC))?[[r.t,0]]:splitUrl(r.t);\n      for(const [tx,isUrl] of segs){\n        const cls=[];for(const[k,b]of FLAGS)if(r.f&b)cls.push(k);\n        if(r.m)cls.push('m','m'+r.m);\n        const link=!!r.h&&!(r.f&FC),dO=edit?'':` data-o=\"${o}\"`;\n        let tag;\n        if(link){cls.push('lk');tag=edit?`<a class=\"${cls.join(' ')}\" data-href=\"${esc(r.h)}\" title=\"Ctrl+クリックで開く\"${g}${dO}>`:`<a class=\"${cls.join(' ')}\" href=\"${esc(r.h)}\" ${r.h[0]==='#'?'':'target=\"_blank\" rel=\"noopener noreferrer\" '}${g}${dO}>`;inner+=tag+esc(tx)+'<\/a>'}\n        else if(isUrl){cls.push('url');tag=edit?`<span class=\"${cls.join(' ')}\"${g}${dO}>`:`<a class=\"${cls.join(' ')}\" href=\"${esc(tx)}\" target=\"_blank\" rel=\"noopener noreferrer\"${g}${dO}>`;inner+=tag+esc(tx)+(edit?'<\/span>':'<\/a>')}\n        else{inner+=`<span${cls.length?` class=\"${cls.join(' ')}\"`:''}${g}${dO}>${esc(tx)}<\/span>`}\n        o+=tx.length;\n      }\n    }\n    if(!lineText(l))inner+='<br>';\n    h+=`<div ${a}>${inner}<\/div>`;\n  });\n  return h;\n}\n\nconst $=id=>document.getElementById(id),sheet=$('sheet'),body=document.body;\nlet SEL=null,tocInit=false;\nconst S={docId:0,lines:[newLine()],name:'',dirty:false,stage:'all',mode:'view'},H=[],F=[];\nconst serialize=()=>serializeLines(S.lines);\nconst legacyDone=()=>{try{return localStorage.getItem('ankiLegacyV3')==='1'}catch{return false}};\nconst legacyMark=()=>{try{localStorage.setItem('ankiLegacyV3','1')}catch{}};\nconst MD_RE=/\\.(md|markdown)$/i;\nconst mdNameOf=n=>MD_RE.test(n)?n:(n||'memo').replace(/\\.[^.]*$/,'')+'.md';\n\n/* storage */\nconst idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('anki-sheet-m',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});\nasync function kvGet(k){try{const d=await idb( function detect(){
  const set=(code,label)=>{sh.reason=(code==='m'?'スマホ':'PC')+(label?'（'+label+'）':'');return code};
  const ua=navigator.userAgent||'',uad=navigator.userAgentData,tp=navigator.maxTouchPoints||0;

      if(/^(Android|iOS)$/i.test(pf))return set('m',pf+'・タブレット');
      if(pf)return set('pc',pf);
    }
    if(/iPhone|iPod/.test(ua))return set('m','iPhone');
    if(/iPad/.test(ua))return set('m','iPad');
    if(/Android/.test(ua))return set('m','Android');
    if(/Windows Phone|IEMobile|BlackBerry|Opera Mini|\bMobi/i.test(ua))return set('m','モバイル');
    if(/Macintosh/.test(ua)&&tp>1)return set('m','iPad');
    if(/Windows NT/.test(ua))return set('pc','Windows');
    if(/Macintosh/.test(ua))return set('pc','macOS');
    if(/CrOS/.test(ua))return set('pc','ChromeOS');
    if(/X11|Linux/.test(ua))return set('pc','Linux');

  if((e.ctrlKey||e.metaKey)&&e.code==='KeyP'){e.preventDefault();try{sh.frames[sh.target].contentWindow.__anki.print()}catch{}}
});
</script>
